.card{
  margin-top:28px;
  background:white;
  border-radius:30px;
  padding:22px;
  box-shadow:0 14px 36px rgba(0,0,0,.14);
  animation:cardPop .35s ease;
}

@keyframes cardPop{
  from{
    opacity:0;
    transform:translateY(20px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
