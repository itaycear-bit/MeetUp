<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleAir</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#ffffff,#f3eadf 45%,#fffaf5);
  color:#191919;
}

#app{
  max-width:430px;
  margin:auto;
  padding:28px 18px 80px;
}

.hero{
  text-align:center;
  padding:30px 10px;
}

.logo{
  font-size:90px;
  animation:float 2.5s infinite;
}

@keyframes float{
  50%{transform:translateY(-10px)}
}

h1{
  font-size:50px;
  margin:8px 0;
}

.subtitle{
  color:#6d6258;
  font-size:17px;
  line-height:1.6;
}

.card{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(12px);
  border-radius:32px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 18px 40px rgba(0,0,0,.09);
}

input,select{
  width:100%;
  box-sizing:border-box;
  border:0;
  background:#f3eee7;
  padding:16px;
  border-radius:18px;
  font-size:16px;
  margin-top:12px;
}

button{
  width:100%;
  border:0;
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  font-size:17px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#111,#4a4038);
  cursor:pointer;
}

.styles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.style-btn{
  background:white;
  color:#111;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.result{
  display:none;
}

.outfit{
  background:#f8f3ed;
  border-radius:26px;
  padding:16px;
  margin-top:15px;
  text-align:right;
  border:1px solid rgba(0,0,0,.04);
}

.outfit-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.outfit-icon{
  font-size:42px;
}

.items{
  display:grid;
  gap:10px;
  margin-top:12px;
}

.item{
  background:white;
  border-radius:18px;
  padding:13px;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.tag{
  background:white;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.shop{
  display:block;
  background:#111;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:14px;
  border-radius:18px;
  margin-top:12px;
  font-weight:900;
}

.save{
  background:#7b5d45;
}

.saved-box{
  display:none;
}
</style>
</head>

<body>

<div id="app">

  <section class="hero">
    <div class="logo">👕✨</div>
    <h1>StyleAir</h1>
    <p class="subtitle">
      בונה לך לוק רגוע ונקי לפי הסגנון, המידה, התקציב וההשראה שלך.
    </p>
  </section>

  <div class="card">
    <h2>✨ בנה לי לוק</h2>

    <input id="tiktok" placeholder="🔗 הדבק קישור מטיקטוק / השראה">

    <select id="style">
      <option value="Streetwear">Streetwear</option>
      <option value="Old School">Old School</option>
      <option value="Casual">Casual</option>
      <option value="Elegant">Elegant</option>
      <option value="Dark">Dark / Night</option>
    </select>

    <select id="size">
      <option value="S">מידה S</option>
      <option value="M">מידה M</option>
      <option value="L">מידה L</option>
      <option value="XL">מידה XL</option>
    </select>

    <select id="budget">
      <option value="זול">תקציב זול</option>
      <option value="בינוני">תקציב בינוני</option>
      <option value="גבוה">תקציב גבוה</option>
    </select>

    <button onclick="buildLook()">בנה לי 3 לוקים</button>
  </div>

  <div class="card">
    <h2>סגנונות מהירים</h2>
    <div class="styles">
      <button class="style-btn" onclick="quickStyle('Streetwear')">👟 Street</button>
      <button class="style-btn" onclick="quickStyle('Old School')">🧥 Old School</button>
      <button class="style-btn" onclick="quickStyle('Casual')">👕 Casual</button>
      <button class="style-btn" onclick="quickStyle('Elegant')">🕶️ Elegant</button>
    </div>
  </div>

  <div id="result" class="card result">
    <h2>הלוקים שלך</h2>
    <div id="outfits"></div>
  </div>

  <div id="savedBox" class="card saved-box">
    <h2>❤️ לוקים ששמרת</h2>
    <div id="savedLooks"></div>
  </div>

</div>

<script>
let saved = JSON.parse(localStorage.getItem("savedLooks")) || [];

function quickStyle(style){
  document.getElementById("style").value = style;
  buildLook();
}

function dataByStyle(style){
  const data = {
    "Streetwear": {
      icon:"👟",
      title:"Streetwear",
      looks:[
        ["חולצת אוברסייז", "ג׳ינס רחב", "סניקרס לבנות", "כובע / שרשרת"],
        ["הודי רחב", "דגמ״ח", "נעלי ספורט גבוהות", "תיק צד"],
        ["טי־שירט גרפית", "מכנס רחב כהה", "סניקרס צבעוניות", "טבעת כסף"]
      ]
    },
    "Old School": {
      icon:"🧥",
      title:"Old School",
      looks:[
        ["ג׳קט וינטג׳", "חולצה חלקה", "ג׳ינס ישר", "נעליים קלאסיות"],
        ["חולצת פולו", "ג׳ינס בהיר", "סניקרס רטרו", "שעון ישן"],
        ["מעיל ג׳ינס", "טי־שירט לבנה", "מכנס ישר", "נעלי עור"]
      ]
    },
    "Casual": {
      icon:"👕",
      title:"Casual",
      looks:[
        ["טי־שירט איכותית", "מכנס נוח", "סניקרס נקיות", "שעון פשוט"],
        ["חולצת פשתן", "מכנס קצר נקי", "נעליים לבנות", "צמיד עדין"],
        ["סווטשירט דק", "ג׳ינס כחול", "נעלי קז׳ואל", "בושם עדין"]
      ]
    },
    "Elegant": {
      icon:"🕶️",
      title:"Elegant",
      looks:[
        ["חולצה מכופתרת", "מכנס מחויט", "נעליים נקיות", "בושם טוב"],
        ["סריג דק", "מכנס שחור", "נעלי עור", "שעון מתכתי"],
        ["בלייזר קל", "טי־שירט חלקה", "מכנס אלגנט", "משקפי שמש"]
      ]
    },
    "Dark": {
      icon:"🌙",
      title:"Dark Night",
      looks:[
        ["חולצה שחורה", "ג׳ינס שחור", "נעליים כהות", "אקססורי כסף"],
        ["הודי שחור", "מכנס קרגו כהה", "סניקרס שחורות", "שרשרת"],
        ["מעיל עור", "חולצה כהה", "ג׳ינס סקיני", "טבעת כסף"]
      ]
    }
  };

  return data[style];
}

function buildLook(){
  const style = document.getElementById("style").value;
  const size = document.getElementById("size").value;
  const budget = document.getElementById("budget").value;
  const tiktok = document.getElementById("tiktok").value;

  const data = dataByStyle(style);

  document.getElementById("result").style.display = "block";

  document.getElementById("outfits").innerHTML = data.looks.map((items,index)=>`
    <div class="outfit">
      <div class="outfit-top">
        <div>
          <h3>${data.icon} ${data.title} Fit ${index+1}</h3>
          <p>${tiktok ? "מבוסס גם על ההשראה שהדבקת 🔗" : "לוק מוצע לפי הבחירות שלך."}</p>
        </div>
        <div class="outfit-icon">${data.icon}</div>
      </div>

      <div class="items">
        ${items.map(item => `<div class="item">🛍️ ${item}</div>`).join("")}
      </div>

      <div class="tags">
        <span class="tag">מידה: ${size}</span>
        <span class="tag">תקציב: ${budget}</span>
        <span class="tag">סגנון: ${style}</span>
      </div>

      <div class="actions">
        <button class="save" onclick="saveLook('${data.title} Fit ${index+1}')">❤️ שמור</button>
        <a class="shop" href="https://www.google.com/search?q=${encodeURIComponent(style + ' outfit clothes ' + size)}" target="_blank">🛒 חפש</a>
      </div>
    </div>
  `).join("");

  renderSaved();
}

function saveLook(name){
  if(!saved.includes(name)){
    saved.push(name);
    localStorage.setItem("savedLooks", JSON.stringify(saved));
  }
  renderSaved();
  alert("הלוק נשמר ❤️");
}

function renderSaved(){
  if(saved.length === 0) return;

  document.getElementById("savedBox").style.display = "block";
  document.getElementById("savedLooks").innerHTML =
    saved.map(s => `<div class="item">❤️ ${s}</div>`).join("");
}

renderSaved();
</script>

</body>
</html>
