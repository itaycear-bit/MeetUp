<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, #ffffff, #e9e9e9);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #111;
}

#app {
  text-align: center;
  max-width: 390px;
  width: 100%;
  padding: 24px;
}

.logo {
  font-size: 52px;
  margin-bottom: 5px;
}

.title {
  font-size: 48px;
  font-weight: 900;
  margin: 0;
}

.subtitle {
  color: #444;
  margin: 14px 0 28px;
  font-size: 17px;
}

.main-btn {
  width: 100%;
  padding: 17px;
  background: #111;
  color: white;
  border: none;
  border-radius: 22px;
  font-size: 18px;
  transition: 0.2s;
}

.main-btn:active,
.grid button:active,
.action-btn:active,
.whatsapp-btn:active {
  transform: scale(0.97);
}

.options {
  display: none;
  margin-top: 28px;
}

.choose {
  font-weight: 700;
  margin-bottom: 14px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.grid button {
  background: white;
  border: none;
  border-radius: 18px;
  padding: 18px;
  font-size: 17px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.10);
  transition: 0.2s;
}

.card {
  margin-top: 30px;
  background: white;
  border-radius: 26px;
  padding: 24px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.13);
  animation: pop 0.25s ease;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card h2 {
  margin-top: 0;
  font-size: 26px;
}

.card p {
  font-size: 17px;
  margin: 10px 0;
}

.action-btn {
  background: #111;
  color: white;
  border: none;
  border-radius: 15px;
  padding: 14px 20px;
  font-size: 15px;
}

.whatsapp-btn {
  background: #25D366;
  color: white;
  border: none;
  border-radius: 15px;
  padding: 14px 20px;
  font-size: 15px;
}

.small {
  color: #666;
  font-size: 14px;
  margin-top: 16px;
}
</style>
</head>

<body>

<div id="app">
  <div class="logo">📍</div>
  <h1 class="title">MeetUp</h1>
  <p class="subtitle">לא יודעים איפה להיפגש? נמצא לכם מקום לפי הווייב</p>

  <button class="main-btn" onclick="start()">מצא לי מקום</button>

  <div id="options" class="options">
    <p class="choose">בחרו וייב</p>

    <div class="grid">
      <button onclick="find('קפה')">☕ קפה</button>
      <button onclick="find('אוכל')">🍔 אוכל</button>
      <button onclick="find('פארק')">🌳 פארק</button>
      <button onclick="find('בר')">🍻 בר</button>
      <button onclick="find('קינוח')">🍰 קינוח</button>
      <button onclick="find('שקט')">🤫 שקט</button>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
function start() {
  document.getElementById("options").style.display = "block";
}

function find(type) {
  const places = {
    "קפה": [
      {name: "ארומה", price: "₪20–₪40", rating: "4.2⭐", taste: "קפה ומאפים"},
      {name: "לנדוור", price: "₪30–₪60", rating: "4.5⭐", taste: "בראנץ וקפה"},
      {name: "קפה גרג", price: "₪25–₪50", rating: "4.1⭐", taste: "קפה וקינוחים"}
    ],
    "אוכל": [
      {name: "BBB", price: "₪60–₪100", rating: "4.6⭐", taste: "המבורגרים"},
      {name: "סושי בר", price: "₪80–₪150", rating: "4.7⭐", taste: "סושי"},
      {name: "פיצה", price: "₪50–₪90", rating: "4.3⭐", taste: "פיצה"}
    ],
    "פארק": [
      {name: "פארק קרוב", price: "חינם", rating: "4.8⭐", taste: "טבע ואוויר פתוח"},
      {name: "גן ציבורי", price: "חינם", rating: "4.3⭐", taste: "שקט ונעים"}
    ],
    "בר": [
      {name: "פאב שכונתי", price: "₪40–₪80", rating: "4.4⭐", taste: "בירה ואווירה"},
      {name: "בר קוקטיילים", price: "₪60–₪120", rating: "4.6⭐", taste: "קוקטיילים ומוזיקה"}
    ],
    "קינוח": [
      {name: "גלידרייה", price: "₪20–₪45", rating: "4.6⭐", taste: "גלידה וקינוחים"},
      {name: "קרפ צרפתי", price: "₪25–₪55", rating: "4.4⭐", taste: "מתוק וכיף"}
    ],
    "שקט": [
      {name: "בית קפה שקט", price: "₪25–₪60", rating: "4.5⭐", taste: "שיחה רגועה"},
      {name: "פארק שקט", price: "חינם", rating: "4.7⭐", taste: "אוויר ושקט"}
    ]
  };

  let list = places[type];
  let random = list[Math.floor(Math.random() * list.length)];

  let mapLink = "https://www.google.com/maps/search/" + encodeURIComponent(random.name);

  let whatsappText =
    "בוא ניפגש פה 👇🔥\n" +
    random.name + "\n" +
    random.taste + "\n" +
    random.price + " | " + random.rating + "\n" +
    mapLink;

  let whatsappLink = "https://wa.me/?text=" + encodeURIComponent(whatsappText);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>📍 ${random.name}</h2>
      <p>🍽️ ${random.taste}</p>
      <p>💰 ${random.price}</p>
      <p>⭐ ${random.rating}</p>

      <a href="${mapLink}" target="_blank">
        <button class="action-btn">פתח במפות</button>
      </a>

      <br><br>

      <a href="${whatsappLink}" target="_blank">
        <button class="whatsapp-btn">שלח לחבר בוואטסאפ</button>
      </a>

      <p class="small">המחירים והדירוגים כרגע לדוגמה</p>
    </div>
  `;
}
</script>

</body>
</html>
