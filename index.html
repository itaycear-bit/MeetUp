\<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleAir</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#111;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#f7f1e8;
  padding-bottom:40px;
}

.hero{
  background:
    linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.7)),
    radial-gradient(circle at top,#d8c1a8,#7b604d);
  color:white;
  padding:34px 20px 28px;
  border-radius:0 0 42px 42px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  width:64px;
  height:64px;
  border-radius:22px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  box-shadow:0 14px 30px rgba(0,0,0,.25);
}

.badge{
  background:rgba(255,255,255,.18);
  padding:9px 14px;
  border-radius:999px;
  font-size:13px;
  backdrop-filter:blur(10px);
}

h1{
  font-size:52px;
  margin:30px 0 8px;
  line-height:1;
}

.hero p{
  color:#eee;
  font-size:17px;
  line-height:1.5;
  margin:0;
}

.startBtn{
  margin-top:22px;
  width:100%;
  border:0;
  border-radius:24px;
  padding:17px;
  background:white;
  color:#111;
  font-size:17px;
  font-weight:900;
}

.section{
  padding:18px;
}

.card{
  background:white;
  border-radius:30px;
  padding:18px;
  margin-top:18px;
  box-shadow:0 16px 34px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 12px;
}

.ai-card{
  background:#111;
  color:white;
}

input,select{
  width:100%;
  border:0;
  background:#f0ebe4;
  border-radius:18px;
  padding:16px;
  margin-top:11px;
  font-size:16px;
  outline:none;
}

.ai-card input,
.ai-card select{
  background:#242424;
  color:white;
}

button{
  width:100%;
  border:0;
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  background:linear-gradient(135deg,#caa17a,#6b4f3d);
  color:white;
}

.darkBtn{
  background:#111;
  color:white;
}

.styles{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:4px;
}

.style{
  min-width:125px;
  height:130px;
  border-radius:26px;
  background:#fff;
  padding:16px;
  box-shadow:0 12px 26px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.style .emoji{
  font-size:38px;
}

.style b{
  font-size:15px;
}

.result{
  display:none;
}

.look{
  background:#fbf7f1;
  border-radius:28px;
  padding:16px;
  margin-top:14px;
  border:1px solid rgba(0,0,0,.05);
}

.lookHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.lookIcon{
  width:68px;
  height:68px;
  border-radius:22px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  box-shadow:0 10px 22px rgba(0,0,0,.08);
}

.items{
  display:grid;
  gap:10px;
  margin-top:14px;
}

.item{
  background:white;
  border-radius:18px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tagRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.tag{
  background:white;
  border-radius:999px;
  padding:8px 12px;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.save{
  background:#ead7c2;
  color:#111;
}

.shop{
  display:block;
  text-decoration:none;
  text-align:center;
  background:#111;
  color:white;
  border-radius:18px;
  padding:14px;
  font-weight:900;
}

.savedBox{
  display:none;
}

.muted{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <div class="top">
      <div class="logo">👕</div>
      <div class="badge">AI Stylist</div>
    </div>

    <h1>StyleAir</h1>
    <p>
      לא יודע מה ללבוש?  
      תבחר סגנון, מידה ותקציב — ותקבל לוקים מוכנים.
    </p>

    <button class="startBtn" onclick="goBuilder()">בנה לי לוק ✨</button>
  </div>

  <div class="section">

    <div class="card">
      <h2>בחר וייב</h2>

      <div class="styles">
        <div class="style" onclick="pickStyle('Streetwear')">
          <span class="emoji">👟</span>
          <b>Streetwear</b>
          <span class="muted">רחוב ונוח</span>
        </div>

        <div class="style" onclick="pickStyle('Old School')">
          <span class="emoji">🧥</span>
          <b>Old School</b>
          <span class="muted">וינטג׳ נקי</span>
        </div>

        <div class="style" onclick="pickStyle('Casual')">
          <span class="emoji">👕</span>
          <b>Casual</b>
          <span class="muted">יומיומי</span>
        </div>

        <div class="style" onclick="pickStyle('Elegant')">
          <span class="emoji">🕶️</span>
          <b>Elegant</b>
          <span class="muted">מסודר</span>
        </div>

        <div class="style" onclick="pickStyle('Dark')">
          <span class="emoji">🌙</span>
          <b>Dark</b>
          <span class="muted">לילה</span>
        </div>
      </div>
    </div>

    <div class="card ai-card" id="builder">
      <h2>הסטייליסט שלך</h2>

      <input id="inspo" placeholder="🔗 קישור מטיקטוק או תיאור לוק">

      <select id="style">
        <option value="Streetwear">Streetwear</option>
        <option value="Old School">Old School</option>
        <option value="Casual">Casual</option>
        <option value="Elegant">Elegant</option>
        <option value="Dark">Dark / Night</option>
      </select>

      <select id="size">
        <option value="S">מידה S</option>
        <option value="M">מידה M</option>
        <option value="L">מידה L</option>
        <option value="XL">מידה XL</option>
      </select>

      <select id="budget">
        <option value="זול">תקציב זול</option>
        <option value="בינוני">תקציב בינוני</option>
        <option value="גבוה">תקציב גבוה</option>
      </select>

      <button class="primary" onclick="buildLooks()">צור 3 לוקים</button>
    </div>

    <div id="result" class="card result">
      <h2>הלוקים שלך</h2>
      <div id="looks"></div>
    </div>

    <div id="savedBox" class="card savedBox">
      <h2>❤️ שמורים</h2>
      <div id="saved"></div>
    </div>

  </div>
</div>

<script>
let savedLooks = JSON.parse(localStorage.getItem("styleair_saved")) || [];

const data = {
  Streetwear:{
    icon:"👟",
    title:"Streetwear",
    looks:[
      ["חולצת אוברסייז", "ג׳ינס רחב", "סניקרס לבנות", "שרשרת כסף"],
      ["הודי רחב", "דגמ״ח", "נעלי ספורט גבוהות", "תיק צד"],
      ["טי־שירט גרפית", "מכנס רחב", "סניקרס צבעוניות", "כובע"]
    ]
  },
  "Old School":{
    icon:"🧥",
    title:"Old School",
    looks:[
      ["ג׳קט וינטג׳", "טי־שירט לבנה", "ג׳ינס ישר", "נעלי עור"],
      ["חולצת פולו", "ג׳ינס בהיר", "סניקרס רטרו", "שעון ישן"],
      ["מעיל ג׳ינס", "חולצה חלקה", "מכנס ישר", "נעליים קלאסיות"]
    ]
  },
  Casual:{
    icon:"👕",
    title:"Casual",
    looks:[
      ["טי־שירט איכותית", "מכנס נוח", "סניקרס נקיות", "שעון פשוט"],
      ["חולצת פשתן", "מכנס קצר נקי", "נעליים לבנות", "צמיד עדין"],
      ["סווטשירט דק", "ג׳ינס כחול", "נעלי קז׳ואל", "בושם עדין"]
    ]
  },
  Elegant:{
    icon:"🕶️",
    title:"Elegant",
    looks:[
      ["חולצה מכופתרת", "מכנס מחויט", "נעליים נקיות", "בושם טוב"],
      ["סריג דק", "מכנס שחור", "נעלי עור", "שעון מתכתי"],
      ["בלייזר קל", "טי־שירט חלקה", "מכנס אלגנט", "משקפי שמש"]
    ]
  },
  Dark:{
    icon:"🌙",
    title:"Dark Night",
    looks:[
      ["חולצה שחורה", "ג׳ינס שחור", "נעליים כהות", "אקססורי כסף"],
      ["הודי שחור", "קרגו כהה", "סניקרס שחורות", "שרשרת"],
      ["מעיל עור", "חולצה כהה", "ג׳ינס שחור", "טבעת כסף"]
    ]
  }
};

function goBuilder(){
  document.getElementById("builder").scrollIntoView({behavior:"smooth"});
}

function pickStyle(style){
  document.getElementById("style").value = style;
  buildLooks();
}

function buildLooks(){
  const style = document.getElementById("style").value;
  const size = document.getElementById("size").value;
  const budget = document.getElementById("budget").value;
  const inspo = document.getElementById("inspo").value;
  const d = data[style];

  document.getElementById("result").style.display = "block";

  document.getElementById("looks").innerHTML = d.looks.map((items,i)=>`
    <div class="look">
      <div class="lookHead">
        <div>
          <h3>${d.title} Fit ${i+1}</h3>
          <p class="muted">${inspo ? "כולל השראה שהכנסת 🔗" : "לוק לפי הבחירות שלך"}</p>
        </div>
        <div class="lookIcon">${d.icon}</div>
      </div>

      <div class="items">
        ${items.map(x=>`
          <div class="item">
            <span>🛍️ ${x}</span>
            <span>›</span>
          </div>
        `).join("")}
      </div>

      <div class="tagRow">
        <span class="tag">מידה ${size}</span>
        <span class="tag">תקציב ${budget}</span>
        <span class="tag">${style}</span>
      </div>

      <div class="actions">
        <button class="save" onclick="saveLook('${d.title} Fit ${i+1}')">❤️ שמור</button>
        <a class="shop" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(style+' outfit clothes '+size)}">חפש בגדים</a>
      </div>
    </div>
  `).join("");

  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function saveLook(name){
  if(!savedLooks.includes(name)){
    savedLooks.push(name);
    localStorage.setItem("styleair_saved", JSON.stringify(savedLooks));
  }
  renderSaved();
}

function renderSaved(){
  if(savedLooks.length === 0) return;

  document.getElementById("savedBox").style.display = "block";
  document.getElementById("saved").innerHTML =
    savedLooks.map(x=>`<div class="item">❤️ ${x}</div>`).join("");
}

renderSaved();
</script>

</body>
</html>
