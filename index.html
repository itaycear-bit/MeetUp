<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body{margin:0;font-family:-apple-system,Arial,sans-serif;background:linear-gradient(180deg,#fff,#eee);color:#111}
#app{max-width:430px;margin:auto;padding:24px 18px 60px;text-align:center}
.logo{font-size:58px}.title{font-size:48px;font-weight:900;margin:0}.subtitle{color:#666;margin:10px 0 25px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.main-btn{border:0;border-radius:18px;padding:16px;font-size:15px;color:white;cursor:pointer}
.random-btn{background:#111}.smart-btn{background:#7c3aed}.location-btn{background:#0f9d58}.favorites-btn{background:#ff4d6d}
.search-box{width:100%;box-sizing:border-box;border:0;border-radius:20px;padding:16px;font-size:16px;margin:14px 0 18px;box-shadow:0 8px 22px rgba(0,0,0,.1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.grid button{border:0;border-radius:22px;background:white;padding:18px;font-size:16px;box-shadow:0 8px 22px rgba(0,0,0,.1);cursor:pointer}
.card{margin-top:28px;background:white;border-radius:30px;padding:22px;box-shadow:0 14px 36px rgba(0,0,0,.14);animation:cardPop .35s ease}
@keyframes cardPop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card h2{font-size:28px;margin:0 0 10px}.card p{color:#444;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}
.tag{background:#efefef;border-radius:999px;padding:7px 12px;font-size:13px}
.review{background:#f5f5f5;border-radius:18px;padding:14px;margin-top:12px}
.arrows{display:flex;gap:10px;margin-top:16px}
.arrows button{flex:1;border:0;border-radius:16px;padding:14px;background:#efefef;cursor:pointer}
.action-btn,.whatsapp-btn,.fav-btn,.delete-btn{width:100%;border:0;border-radius:18px;padding:15px;font-size:16px;margin-top:12px;cursor:pointer}
.action-btn{background:#111;color:white}.whatsapp-btn{background:#25D366;color:white}.fav-btn{background:#ff4d6d;color:white}.delete-btn{background:#444;color:white}
.location-status{font-size:13px;color:#888;margin-top:12px}
.open{color:#0f9d58;font-weight:800}.closed{color:#e53935;font-weight:800}
#splash{position:fixed;inset:0;background:linear-gradient(180deg,#111,#1b1b1b);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;transition:.4s}
.splash-logo{font-size:120px;cursor:pointer;animation:float 2s ease-in-out infinite}.splash-title{color:white;font-size:42px;font-weight:900}.splash-sub{color:#aaa;margin-top:10px}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}
#dice{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;z-index:9999;animation:spin 1s linear infinite;filter:drop-shadow(0 0 20px rgba(255,255,255,.5))}
@keyframes spin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.25)}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);z-index:9998}
</style>
</head>

<body>

<div id="splash">

<div id="overlay"></div>

function allPlaces(){
  let list = [];
  for(const category in places){
    places[category].forEach((place, index) => {
      list.push({...place, category, index});
    });
  }
  return list;
}

function isOpen(place){
  const hour = new Date().getHours();
  if(place.close === 24) return true;
  if(place.close <= 6) return hour >= 18 || hour < place.close;
  return hour < place.close;
}

function showCategory(category){
  searchMode = false;
  currentCategory = category;
  currentIndex = 0;
  renderPlace();
}

function getCurrentPlace(){
  if(searchMode){
    return searchResults[currentIndex];
  }

  return places[currentCategory][currentIndex];
}

function renderPlace(){
  const place = getCurrentPlace();

  if(!place){
    document.getElementById("result").innerHTML =
    `<div class="card"><h2>בחר קטגוריה קודם 🍒</h2></div>`;
    return;
  }

  const openText = isOpen(place)
    ? `<span class="open">🟢 פתוח עכשיו</span>`
    : `<span class="closed">🔴 סגור עכשיו</span>`;

  const mapLink = userLat && userLon
    ? `https://www.google.com/maps/search/${encodeURIComponent(place.name)}/@${userLat},${userLon},15z`
    : `https://www.google.com/maps/search/${encodeURIComponent(place.name)}`;

  const whatsappLink =
    "https://wa.me/?text=" +
    encodeURIComponent("בוא ניפגש פה 🍒\n" + place.name + "\n" + place.desc + "\n" + mapLink);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>🍒 ${place.name}</h2>
      <p>${place.desc}</p>
      <p>💰 ${place.price}</p>
      <p>⭐ ${place.rating}</p>
      <p>🕒 ${place.hours}</p>
      <p>${openText}</p>

      <div class="tags">
        ${place.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
      </div>

      <div class="review">💬 מקום מומלץ ליציאה קלילה</div>

      <button class="fav-btn" onclick="saveFavorite()">❤️ שמור מקום</button>

      <div class="arrows">
        <button onclick="prevPlace()">➡️ הקודם</button>
        <button onclick="nextPlace()">⬅️ הבא</button>
      </div>

      <button class="action-btn" onclick="window.open('${mapLink}')">📍 פתח במפות</button>
      <button class="whatsapp-btn" onclick="window.open('${whatsappLink}')">📲 שלח בוואטסאפ</button>
    </div>
  `;
}

function nextPlace(){
  if(searchMode){
    currentIndex = (currentIndex + 1) % searchResults.length;
  } else {
    currentIndex = (currentIndex + 1) % places[currentCategory].length;
  }

  renderPlace();
}

function prevPlace(){
  if(searchMode){
    currentIndex--;
    if(currentIndex < 0) currentIndex = searchResults.length - 1;
  } else {
    currentIndex--;
    if(currentIndex < 0) currentIndex = places[currentCategory].length - 1;
  }

  renderPlace();
}

function searchPlaces(){
  const input = document.getElementById("searchInput");
  const query = input.value.trim().toLowerCase();

  if(query === ""){
    searchMode = false;
    document.getElementById("result").innerHTML = "";
    return;
  }

  searchResults = [];

  for(const category in places){
    for(let i = 0; i < places[category].length; i++){
      const place = places[category][i];

      const text = `
        ${category}
        ${place.name}
        ${place.desc}
        ${place.price}
        ${place.rating}
        ${place.hours}
        ${place.tags.join(" ")}
      `.toLowerCase();

      if(text.includes(query)){
        searchResults.push({...place, category, index:i});
      }
    }
  }

  if(searchResults.length === 0){
    searchMode = false;
    document.getElementById("result").innerHTML = `
      <div class="card">
        <h2>לא מצאתי כלום 😅</h2>
        <p>נסה: בר, פיצה, קפה, ים, אוכל, פארק</p>
      </div>
    `;
    return;
  }

  searchMode = true;
  currentIndex = 0;
  renderPlace();
}

function randomPlace(){
  const dice = document.getElementById("dice");
  const overlay = document.getElementById("overlay");

  document.getElementById("result").innerHTML = "";
  overlay.style.display = "block";
  dice.style.display = "block";
  navigator.vibrate?.(200);

  setTimeout(() => {
    overlay.style.display = "none";
    dice.style.display = "none";

    const categories = Object.keys(places);
    currentCategory = categories[Math.floor(Math.random()*categories.length)];
    currentIndex = Math.floor(Math.random()*places[currentCategory].length);
    searchMode = false;

    renderPlace();
  },1800);
}

function smartPick(){
  const hour = new Date().getHours();

  if(hour >= 20){
    currentCategory = "בר";
  } else if(hour >= 16){
    currentCategory = "אוכל";
  } else {
    currentCategory = "קפה";
  }

  currentIndex = 0;
  searchMode = false;
  renderPlace();
}

function enableLocation(){
  const status = document.getElementById("locationStatus");

  if(!navigator.geolocation){
    status.innerText = "❌ המכשיר לא תומך במיקום";
    return;
  }

  status.innerText = "📍 מבקש גישה למיקום...";

  navigator.geolocation.getCurrentPosition(
    position => {
      userLat = position.coords.latitude;
      userLon = position.coords.longitude;
      status.innerText = "✅ המיקום הופעל";
    },
    error => {
      status.innerText = "❌ לא אישרת מיקום";
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }
  );
}

function saveFavorite(){
  const place = getCurrentPlace();

  if(!place){
    return;
  }

  const exists = favorites.find(f => f.name === place.name);

  if(exists){
    alert("כבר שמור ❤️");
    return;
  }

  favorites.push(place);
  localStorage.setItem("favorites", JSON.stringify(favorites));
  alert("נשמר במועדפים ❤️");
}

function showFavorites(){
  const result = document.getElementById("result");

  if(favorites.length === 0){
    result.innerHTML = `
      <div class="card">
        <h2>אין מועדפים עדיין ❤️</h2>
      </div>
    `;
    return;
  }

  result.innerHTML =
  favorites.map((place,index)=>`
    <div class="card">
      <h2>❤️ ${place.name}</h2>
      <p>${place.desc}</p>
      <p>⭐ ${place.rating}</p>
      <p>💰 ${place.price}</p>
      <button class="delete-btn" onclick="removeFavorite(${index})">🗑️ מחק</button>
    </div>
  `).join("");
}

function removeFavorite(index){
  favorites.splice(index,1);
  localStorage.setItem("favorites", JSON.stringify(favorites));
  showFavorites();
}
</script>

</body>
</html>
