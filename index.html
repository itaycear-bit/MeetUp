<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial,sans-serif;
  background:linear-gradient(180deg,#ffffff,#ececec);
  color:#111;
  transition:.3s;
}

.dark{
  background:#111;
  color:white;
}

#app{
  max-width:430px;
  margin:auto;
  padding:30px 20px 60px;
  text-align:center;
}

.logo{font-size:60px}
.title{font-size:52px;font-weight:900;margin:0}
.subtitle{color:#666;margin:10px 0 25px;font-size:17px}

.main-btn{
  width:100%;
  border:0;
  border-radius:22px;
  padding:17px;
  font-size:17px;
  cursor:pointer;
  background:#111;
  color:white;
  margin-top:12px;
}

.moods{
  display:flex;
  overflow:auto;
  gap:10px;
  margin-bottom:20px;
  padding-bottom:5px;
}

.moods button{
  border:0;
  background:white;
  border-radius:999px;
  padding:12px 16px;
  font-size:15px;
  white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:25px;
}

.grid button{
  border:0;
  border-radius:22px;
  background:white;
  padding:18px;
  font-size:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.1);
}

.card{
  margin-top:28px;
  background:white;
  border-radius:30px;
  padding:22px;
  box-shadow:0 14px 36px rgba(0,0,0,.14);
  animation:pop .25s ease;
}

.dark .card{background:#1d1d1d}

@keyframes pop{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

.card h2{font-size:28px;margin:0 0 10px}
.card p{color:#444;font-size:16px}
.dark .card p{color:#ddd}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:15px 0;
}

.tag{
  background:#efefef;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
}

.dark .tag{background:#333;color:white}

.review{
  background:#f5f5f5;
  border-radius:18px;
  padding:14px;
  margin-top:12px;
}

.dark .review{background:#2b2b2b}

.arrows{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.arrows button{
  flex:1;
  border:0;
  border-radius:16px;
  padding:14px;
  background:#efefef;
}

.dark .arrows button{
  background:#333;
  color:white;
}

.action-btn,.whatsapp-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  margin-top:12px;
}

.action-btn{background:#111;color:white}
.whatsapp-btn{background:#25D366;color:white}
.popular{margin-top:12px;color:#ff3b5c;font-weight:bold}
.small{font-size:13px;color:#888;margin-top:12px}

button{cursor:pointer}

#dice{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:120px;
  z-index:9999;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
  to{transform:translate(-50%,-50%) rotate(360deg) scale(1.2)}
}

#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px);
  z-index:9998;
}

#confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10000;
}

.confetti-piece{
  position:absolute;
  font-size:24px;
  animation:fall 1.5s linear forwards;
}

@keyframes fall{
  from{transform:translateY(-30px) rotate(0deg);opacity:1}
  to{transform:translateY(100vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div id="overlay"></div>
<div id="confetti"></div>

<div id="app">
  <div class="logo">🍒</div>
  <h1 class="title">MeetUp</h1>
  <p class="subtitle">תבחרו וייב ותמצאו מקום מושלם להיפגש</p>

  <div class="moods">
    <button onclick="setMood('רגוע')">😌 רגוע</button>
    <button onclick="setMood('אנרגטי')">⚡ אנרגטי</button>
    <button onclick="setMood('רומנטי')">❤️ רומנטי</button>
    <button onclick="setMood('ספונטני')">🎲 ספונטני</button>
  </div>

  <button class="main-btn" onclick="randomPlace()">🎲 תבחר בשבילי</button>
  <button class="main-btn" onclick="toggleDark()" style="background:#333;">🌙 מצב לילה</button>

  <div class="grid">
    <button onclick="showCategory('פיצה')">🍕 פיצה</button>
    <button onclick="showCategory('קפה')">☕ קפה</button>
    <button onclick="showCategory('אוכל')">🍔 אוכל</button>
    <button onclick="showCategory('בר')">🍻 בר</button>
    <button onclick="showCategory('פארק')">🌳 פארק</button>
    <button onclick="showCategory('ים')">🌊 ים</button>
  </div>

  <div id="dice">🎲</div>
  <div id="result"></div>
</div>

<script>
let currentCategory = "";
let currentIndex = 0;
let currentMood = "";

const places = {
  "פיצה":[
    {
      name:"פיצה האט",
      price:"₪50–₪100",
      rating:"4.2⭐",
      hours:"פתוח עד 23:00",
      desc:"פיצה טובה לקבוצה ולערב קליל.",
      review:"טעים, מהיר ואווירה טובה.",
      tags:["פיצה","חברים","לילה"],
      popular:"🔥 פופולרי עכשיו"
    },
    {
      name:"דומינוס",
      price:"₪45–₪90",
      rating:"4.4⭐",
      hours:"פתוח עד 00:00",
      desc:"קליל, מהיר ומתאים לחבורה.",
      review:"אחלה מקום כשלא יודעים מה להזמין.",
      tags:["מהיר","פיצה","קליל"],
      popular:""
    }
  ],

  "קפה":[
    {
      name:"לנדוור",
      price:"₪35–₪70",
      rating:"4.5⭐",
      hours:"פתוח עד 23:00",
      desc:"קפה, בראנץ׳ וישיבה ארוכה.",
      review:"מקום מושלם לשיחה רגועה.",
      tags:["בראנץ׳","קפה","שקט"],
      popular:"🔥 פופולרי עכשיו"
    },
    {
      name:"ארומה",
      price:"₪20–₪45",
      rating:"4.2⭐",
      hours:"פתוח עד 22:00",
      desc:"קפה קליל ומהיר.",
      review:"טוב לפגישה קצרה.",
      tags:["זול","קפה","מהיר"],
      popular:""
    }
  ],

  "בר":[
    {
      name:"בר גג",
      price:"₪70–₪150",
      rating:"4.7⭐",
      hours:"פתוח עד 02:00",
      desc:"נוף יפה וקוקטיילים.",
      review:"מרגיש כמו חו״ל.",
      tags:["נוף","לילה","קוקטיילים"],
      popular:"🔥 פופולרי עכשיו"
    },
    {
      name:"פאב שכונתי",
      price:"₪40–₪90",
      rating:"4.4⭐",
      hours:"פתוח עד 01:00",
      desc:"בירה ואווירה קלילה.",
      review:"לא יקר וכיף לשבת.",
      tags:["בירה","חברים","קליל"],
      popular:""
    }
  ],

  "פארק":[
    {
      name:"פארק גדול",
      price:"חינם",
      rating:"4.8⭐",
      hours:"פתוח 24/7",
      desc:"טבע, אוויר פתוח ושקט.",
      review:"אחלה מקום לדבר.",
      tags:["טבע","שקט","חינם"],
      popular:"🔥 פופולרי עכשיו"
    },
    {
      name:"טיילת",
      price:"חינם",
      rating:"4.7⭐",
      hours:"פתוח 24/7",
      desc:"הליכה ושיחה מול הנוף.",
      review:"הכי טוב בערב.",
      tags:["נוף","הליכה","חינם"],
      popular:""
    }
  ],

  "ים":[
    {
      name:"חוף שקט",
      price:"חינם",
      rating:"4.9⭐",
      hours:"פתוח 24/7",
      desc:"ים, שקיעה ושיחה טובה.",
      review:"וייב מטורף בערב.",
      tags:["ים","שקיעה","רגוע"],
      popular:"🔥 פופולרי עכשיו"
    },
    {
      name:"טיילת ים",
      price:"חינם",
      rating:"4.7⭐",
      hours:"פתוח 24/7",
      desc:"הליכה מול הים.",
      review:"אווירה רגועה ונעימה.",
      tags:["ים","הליכה","נוף"],
      popular:""
    }
  ],

  "אוכל":[
    {
      name:"BBB",
      price:"₪60–₪110",
      rating:"4.6⭐",
      hours:"פתוח עד 00:00",
      desc:"המבורגרים ואווירה טובה.",
      review:"טעים ומשביע.",
      tags:["המבורגר","חברים","לילה"],
      popular:"🔥 פופולרי עכשיו"
    },
    {
      name:"סושי בר",
      price:"₪80–₪150",
      rating:"4.7⭐",
      hours:"פתוח עד 23:00",
      desc:"סושי איכותי ואווירה יפה.",
      review:"אוכל טוב ומקום נעים.",
      tags:["סושי","איכותי","שקט"],
      popular:""
    }
  ]
};

function showCategory(category){
  currentCategory = category;
  currentIndex = 0;
  renderPlace();
}

function renderPlace(){
  const place = places[currentCategory][currentIndex];

  const mapLink =
    "https://www.google.com/maps/search/" +
    encodeURIComponent(place.name);

  const whatsappLink =
    "https://wa.me/?text=" +
    encodeURIComponent(
      "בוא ניפגש פה 🍒\n" +
      place.name + "\n" +
      place.desc + "\n" +
      mapLink
    );

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>🍒 ${place.name}</h2>

      <div class="popular">${place.popular}</div>

      <p>${place.desc}</p>
      <p>💰 ${place.price}</p>
      <p>⭐ ${place.rating}</p>
      <p>🕒 ${place.hours}</p>

      <div class="tags">
        ${place.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
      </div>

      <div class="review">💬 "${place.review}"</div>

      <div class="arrows">
        <button onclick="prevPlace()">➡️ הקודם</button>
        <button onclick="nextPlace()">⬅️ הבא</button>
      </div>

      <button class="action-btn" onclick="window.open('${mapLink}')">פתח במפות</button>
      <button class="whatsapp-btn" onclick="window.open('${whatsappLink}')">שלח לחבר בוואטסאפ</button>

      <div class="small">גרסת MVP ראשונית</div>
    </div>
  `;
}

function nextPlace(){
  currentIndex++;

  if(currentIndex >= places[currentCategory].length){
    currentIndex = 0;
  }

  renderPlace();
}

function prevPlace(){
  currentIndex--;

  if(currentIndex < 0){
    currentIndex = places[currentCategory].length - 1;
  }

  renderPlace();
}

function randomPlace(){
  document.getElementById("result").innerHTML = "";

  const dice = document.getElementById("dice");
  const overlay = document.getElementById("overlay");

  overlay.style.display = "block";
  dice.style.display = "block";

  setTimeout(() => {
    dice.style.display = "none";
    overlay.style.display = "none";

    const categories = Object.keys(places);
    const randomCategory =
      categories[Math.floor(Math.random() * categories.length)];

    currentCategory = randomCategory;
    currentIndex =
      Math.floor(Math.random() * places[randomCategory].length);

    renderPlace();
    launchConfetti();
  }, 1800);
}

function launchConfetti(){
  const confetti = document.getElementById("confetti");
  confetti.innerHTML = "";

  for(let i = 0; i < 35; i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.innerHTML = ["🎉","✨","🍒","⭐"][Math.floor(Math.random()*4)];

    piece.style.left = Math.random() * 100 + "vw";
    piece.style.animationDelay = Math.random() * 0.5 + "s";

    confetti.appendChild(piece);
  }

  setTimeout(() => {
    confetti.innerHTML = "";
  }, 2200);
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

function setMood(mood){
  currentMood = mood;

  if(mood === "רגוע"){
    currentCategory = "פארק";
  }

  else if(mood === "אנרגטי"){
    currentCategory = "בר";
  }

  else if(mood === "רומנטי"){
    currentCategory = "ים";
  }

  else if(mood === "ספונטני"){
    randomPlace();
    return;
  }

  currentIndex = 0;
  renderPlace();
}
</script>

</body>
</html>
