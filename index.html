<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial,sans-serif;
  background:linear-gradient(180deg,#fff,#ececec);
  color:#111;
}
#app{
  max-width:430px;
  margin:auto;
  padding:35px 22px;
  text-align:center;
}
.logo{font-size:54px}
.title{font-size:48px;font-weight:900;margin:5px 0}
.subtitle{color:#555;font-size:17px;margin-bottom:26px}
.main-btn{
  width:100%;padding:18px;border:0;border-radius:24px;
  background:#111;color:#fff;font-size:18px;
}
.options{display:none;margin-top:26px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.grid button,.place-btn{
  border:0;border-radius:22px;background:#fff;
  padding:18px;font-size:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.1);
}
#placesList{margin-top:24px;display:grid;gap:12px}
.place-btn{text-align:right}
.card{
  margin-top:28px;background:#fff;border-radius:30px;padding:22px;
  box-shadow:0 14px 36px rgba(0,0,0,.15);
  animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.place-img{
  width:100%;height:180px;object-fit:cover;border-radius:24px;margin-bottom:16px;
}
.card h2{margin:5px 0 12px;font-size:27px}
.card p{font-size:16px;margin:9px 0;color:#333}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.tag{background:#f1f1f1;border-radius:999px;padding:7px 11px;font-size:13px}
.review{
  background:#f7f7f7;border-radius:18px;padding:13px;margin-top:12px;
  font-size:15px;color:#333;
}
.action-btn,.whatsapp-btn{
  width:100%;border:0;border-radius:17px;padding:15px;
  font-size:16px;margin-top:10px;
}
.action-btn{background:#111;color:white}
.whatsapp-btn{background:#25D366;color:white}
button{cursor:pointer}
.small{font-size:13px;color:#777}
</style>
</head>

function showPlaces(type){
  document.getElementById("result").innerHTML="";
  const list=places[type];

  document.getElementById("placesList").innerHTML=
    "<h3>בחרו מקום</h3>" +
    list.map((place,index)=>`
      <button class="place-btn" onclick="showDetails('${type}',${index})">
        <b>${place.name}</b><br>
        ${place.desc}<br>
        ${place.price} · ${place.rating}
      </button>
    `).join("");
}

function showDetails(type,index){
  const place=places[type][index];
  const mapLink="https://www.google.com/maps/search/"+encodeURIComponent(place.name);
  const whatsappText=
`בוא ניפגש פה 👇🔥
${place.name}
${place.desc}
${place.price} | ${place.rating}
${place.hours}
${mapLink}`;
  const whatsappLink="https://wa.me/?text="+encodeURIComponent(whatsappText);

  document.getElementById("result").innerHTML=`
    <div class="card">
      <img class="place-img" src="${place.img}">
      <h2>📍 ${place.name}</h2>
      <p>✨ ${place.desc}</p>
      <p>💰 ${place.price}</p>
      <p>⭐ ${place.rating}</p>
      <p>🕒 ${place.hours}</p>

      <div class="tags">
        ${place.tags.map(t=>`<span class="tag">${t}</span>`).join("")}
      </div>

      <div class="review">💬 “${place.review}”</div>

      <a href="${mapLink}" target="_blank">
        <button class="action-btn">פתח במפות</button>
      </a>

      <a href="${whatsappLink}" target="_blank">
        <button class="whatsapp-btn">שלח לחבר בוואטסאפ</button>
      </a>

      <p class="small">המידע כרגע לדוגמה לגרסת MVP</p>
    </div>
  `;
}
