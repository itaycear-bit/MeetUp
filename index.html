<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleAir</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6efe7;
  color:#151515;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding-bottom:40px;
}

.hero{
  padding:34px 22px 28px;
  background:linear-gradient(160deg,#fff,#e8d7c4);
  border-radius:0 0 42px 42px;
  box-shadow:0 16px 40px rgba(0,0,0,.08);
}

.logo{
  width:78px;
  height:78px;
  border-radius:28px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  box-shadow:0 16px 30px rgba(0,0,0,.18);
}

h1{
  font-size:52px;
  margin:22px 0 8px;
}

.hero p{
  color:#6d5c50;
  font-size:17px;
  line-height:1.5;
  margin:0;
}

.section{
  padding:18px;
}

.card{
  background:white;
  border-radius:30px;
  padding:18px;
  margin-top:18px;
  box-shadow:0 14px 34px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:900;
  margin:14px 0 7px;
}

input,select{
  width:100%;
  border:0;
  background:#f1e8de;
  padding:16px;
  border-radius:18px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  background:#111;
  color:white;
}

.styles{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:4px;
}

.style{
  min-width:126px;
  background:#fff;
  border-radius:24px;
  padding:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.07);
  cursor:pointer;
}

.style span{
  font-size:38px;
  display:block;
  margin-bottom:10px;
}

.style b{
  display:block;
}

.muted{
  color:#777;
  font-size:14px;
}

.result{
  display:none;
}

.look-card{
  background:#141414;
  color:white;
  border-radius:34px;
  padding:18px;
  margin-top:16px;
  overflow:hidden;
  box-shadow:0 18px 38px rgba(0,0,0,.18);
}

.look-visual{
  height:220px;
  border-radius:28px;
  background:linear-gradient(150deg,#3a3028,#d8b38e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:92px;
  margin-bottom:18px;
}

.look-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.look-title h2{
  margin:0;
  font-size:27px;
}

.price{
  background:white;
  color:#111;
  padding:9px 13px;
  border-radius:999px;
  font-weight:900;
  white-space:nowrap;
}

.items{
  display:grid;
  gap:10px;
  margin-top:16px;
}

.item{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:13px;
  display:flex;
  justify-content:space-between;
}

.shops{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}

.shop-tag{
  background:rgba(255,255,255,.12);
  border-radius:999px;
  padding:8px 12px;
  font-size:13px;
}

.arrows{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.arrows button{
  background:#f1e8de;
  color:#111;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.save{
  background:#a47d61;
  color:white;
}

.buy{
  display:block;
  text-decoration:none;
  text-align:center;
  background:white;
  color:#111;
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  font-weight:900;
}

.saved{
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <div class="logo">👕</div>
    <h1>StyleAir</h1>
    <p>
      בונה לך לוק לפי סגנון, מידה, תקציב והשראה מטיקטוק.
      נקי, פשוט, ויפה לעין.
    </p>
  </div>

  <div class="section">

    <div class="card">
      <h2>בחר סגנון</h2>

      <div class="styles">
        <div class="style" onclick="pickStyle('Streetwear')">
          <span>👟</span>
          <b>Streetwear</b>
          <small class="muted">רחוב</small>
        </div>

        <div class="style" onclick="pickStyle('Elegant')">
          <span>🕶️</span>
          <b>Elegant</b>
          <small class="muted">מסודר</small>
        </div>

        <div class="style" onclick="pickStyle('Dark')">
          <span>🌙</span>
          <b>Dark</b>
          <small class="muted">לילה</small>
        </div>

        <div class="style" onclick="pickStyle('Casual')">
          <span>👕</span>
          <b>Casual</b>
          <small class="muted">יומיומי</small>
        </div>

        <div class="style" onclick="pickStyle('Old School')">
          <span>🧥</span>
          <b>Old School</b>
          <small class="muted">וינטג׳</small>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>הפרטים שלך</h2>

      <label>השראה מטיקטוק</label>
      <input id="inspo" placeholder="הדבק קישור או תיאור">

      <label>סגנון</label>
      <select id="style">
        <option value="Streetwear">Streetwear</option>
        <option value="Elegant">Elegant</option>
        <option value="Dark">Dark / Night</option>
        <option value="Casual">Casual</option>
        <option value="Old School">Old School</option>
      </select>

      <label>מידה</label>
      <select id="size">
        <option>S</option>
        <option selected>M</option>
        <option>L</option>
        <option>XL</option>
      </select>

      <label>תקציב</label>
      <select id="budget">
        <option value="low">זול</option>
        <option value="mid" selected>בינוני</option>
        <option value="high">גבוה</option>
      </select>

      <button class="primary" onclick="buildLooks()">בנה לי לוקים</button>
    </div>

    <div id="result" class="result">
      <div id="lookBox"></div>
    </div>

    <div id="savedBox" class="card saved">
      <h2>❤️ שמורים</h2>
      <div id="savedList"></div>
    </div>

  </div>
</div>

<script>
let current = 0;
let currentLooks = [];
let saved = JSON.parse(localStorage.getItem("styleair_saved")) || [];

const data = {
  Streetwear:{
    icon:"👟",
    title:"Streetwear",
    visual:"👟",
    shops:["Zara","H&M","Nike","Terminal X"],
    looks:[
      ["חולצת אוברסייז","ג׳ינס רחב","סניקרס לבנות","שרשרת כסף"],
      ["הודי רחב","דגמ״ח שחור","נעלי ספורט גבוהות","תיק צד"],
      ["טי־שירט גרפית","מכנס רחב","סניקרס צבעוניות","כובע"]
    ]
  },
  Elegant:{
    icon:"🕶️",
    title:"Elegant",
    visual:"🕶️",
    shops:["Zara","Castro","Mango","Terminal X"],
    looks:[
      ["חולצה מכופתרת","מכנס מחויט","נעליים נקיות","בושם טוב"],
      ["סריג דק","מכנס שחור","נעלי עור","שעון מתכתי"],
      ["בלייזר קל","טי־שירט חלקה","מכנס אלגנט","משקפי שמש"]
    ]
  },
  Dark:{
    icon:"🌙",
    title:"Dark Night",
    visual:"🌙",
    shops:["Pull&Bear","Zara","Bershka","ASOS"],
    looks:[
      ["חולצה שחורה","ג׳ינס שחור","נעליים כהות","אקססורי כסף"],
      ["הודי שחור","קרגו כהה","סניקרס שחורות","שרשרת"],
      ["מעיל עור","חולצה כהה","ג׳ינס שחור","טבעת כסף"]
    ]
  },
  Casual:{
    icon:"👕",
    title:"Casual",
    visual:"👕",
    shops:["H&M","Fox","Castro","Terminal X"],
    looks:[
      ["טי־שירט איכותית","מכנס נוח","סניקרס נקיות","שעון פשוט"],
      ["חולצת פשתן","מכנס קצר נקי","נעליים לבנות","צמיד עדין"],
      ["סווטשירט דק","ג׳ינס כחול","נעלי קז׳ואל","בושם עדין"]
    ]
  },
  "Old School":{
    icon:"🧥",
    title:"Old School",
    visual:"🧥",
    shops:["Zara","Levi's","Pull&Bear","ASOS"],
    looks:[
      ["ג׳קט וינטג׳","טי־שירט לבנה","ג׳ינס ישר","נעלי עור"],
      ["חולצת פולו","ג׳ינס בהיר","סניקרס רטרו","שעון ישן"],
      ["מעיל ג׳ינס","חולצה חלקה","מכנס ישר","נעליים קלאסיות"]
    ]
  }
};

function priceByBudget(budget){
  if(budget === "low") return "₪149–₪299";
  if(budget === "mid") return "₪299–₪499";
  return "₪499–₪899";
}

function pickStyle(style){
  document.getElementById("style").value = style;
  buildLooks();
}

function buildLooks(){
  const style = document.getElementById("style").value;
  const size = document.getElementById("size").value;
  const budget = document.getElementById("budget").value;
  const inspo = document.getElementById("inspo").value;

  const d = data[style];

  currentLooks = d.looks.map((items,i)=>({
    name:`${d.title} Fit ${i+1}`,
    icon:d.icon,
    visual:d.visual,
    items,
    shops:d.shops,
    size,
    budget,
    price:priceByBudget(budget),
    inspo
  }));

  current = 0;
  renderLook();
  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function renderLook(){
  const look = currentLooks[current];

  document.getElementById("lookBox").innerHTML = `
    <div class="look-card">
      <div class="look-visual">${look.visual}</div>

      <div class="look-title">
        <h2>${look.name}</h2>
        <div class="price">${look.price}</div>
      </div>

      <p class="muted">
        ${look.inspo ? "מבוסס גם על ההשראה שהכנסת 🔗" : "לוק שנבנה לפי הבחירות שלך"}
      </p>

      <div class="items">
        ${look.items.map(x=>`
          <div class="item">
            <span>🛍️ ${x}</span>
            <span>›</span>
          </div>
        `).join("")}
      </div>

      <div class="shops">
        ${look.shops.map(s=>`<span class="shop-tag">${s}</span>`).join("")}
      </div>

      <div class="arrows">
        <button onclick="prevLook()">➡️ הקודם</button>
        <button onclick="nextLook()">⬅️ הבא</button>
      </div>

      <div class="actions">
        <button class="save" onclick="saveLook()">❤️ שמור</button>
        <a class="buy" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(look.name + ' clothes outfit ' + look.size)}">חפש בגדים</a>
      </div>
    </div>
  `;
}

function nextLook(){
  current++;
  if(current >= currentLooks.length) current = 0;
  renderLook();
}

function prevLook(){
  current--;
  if(current < 0) current = currentLooks.length - 1;
  renderLook();
}

function saveLook(){
  const look = currentLooks[current];
  if(!saved.includes(look.name)){
    saved.push(look.name);
    localStorage.setItem("styleair_saved",JSON.stringify(saved));
  }
  renderSaved();
}

function renderSaved(){
  if(saved.length === 0) return;

  document.getElementById("savedBox").style.display = "block";
  document.getElementById("savedList").innerHTML =
    saved.map(x=>`<div class="card">❤️ ${x}</div>`).join("");
}

renderSaved();
</script>

</body>
</html>
