<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial,sans-serif;
  background:linear-gradient(180deg,#fff,#ececec);
  color:#111;
}
#app{
  max-width:430px;
  margin:auto;
  padding:35px 22px;
  text-align:center;
}
.logo{font-size:58px}
.title{font-size:48px;font-weight:900;margin:5px 0}
.subtitle{color:#555;font-size:17px;margin-bottom:26px}

.main-btn,.action-btn,.whatsapp-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:16px;
  font-size:16px;
  cursor:pointer;
}
.main-btn,.action-btn{background:#111;color:white}
.whatsapp-btn{background:#25D366;color:white}

.options{display:none;margin-top:26px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.grid button{
  border:0;
  border-radius:22px;
  background:white;
  padding:18px;
  font-size:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.1);
}

.card{
  margin-top:28px;
  background:white;
  border-radius:30px;
  padding:20px;
  box-shadow:0 14px 36px rgba(0,0,0,.15);
}
.place-img{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:24px;
}
.card h2{font-size:27px;margin:16px 0 10px}
.card p{font-size:16px;color:#333}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:14px 0;
}
.tag{
  background:#f1f1f1;
  border-radius:999px;
  padding:7px 11px;
  font-size:13px;
}
.review{
  background:#f7f7f7;
  border-radius:18px;
  padding:13px;
  margin:12px 0;
}
.arrows{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.arrows button{
  flex:1;
  padding:14px;
  border:0;
  border-radius:16px;
  background:#eee;
  font-size:16px;
}
.small{font-size:13px;color:#777}
</style>
</head>

    </div>
  </div>

  <div id="result"></div>
</div>

    {name:"שקיעה בים", price:"חינם", rating:"4.9⭐", hours:"מומלץ בערב", desc:"המקום הכי יפה לשיחה רגועה.", review:"שקיעה תמיד מעלה את הווייב.", tags:["שקיעה","רומנטי","ים"], img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900"}
  ]
};

function showCategory(category){
  currentCategory = category;
  currentIndex = 0;
  renderPlace();
}

function nextPlace(){
  currentIndex++;
  if(currentIndex >= places[currentCategory].length){
    currentIndex = 0;
  }
  renderPlace();
}

function prevPlace(){
  currentIndex--;
  if(currentIndex < 0){
    currentIndex = places[currentCategory].length - 1;
  }
  renderPlace();
}

function renderPlace(){
  const place = places[currentCategory][currentIndex];
  const total = places[currentCategory].length;

  const mapLink = "https://www.google.com/maps/search/" + encodeURIComponent(place.name);
  const whatsappText =
`בוא ניפגש פה 🍒
${place.name}
${place.desc}
${place.price} | ${place.rating}
${place.hours}
${mapLink}`;
  const whatsappLink = "https://wa.me/?text=" + encodeURIComponent(whatsappText);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <img class="place-img" src="${place.img}">
      <h2>🍒 ${place.name}</h2>
      <p><b>${currentIndex + 1} מתוך ${total}</b></p>
      <p>✨ ${place.desc}</p>
      <p>💰 ${place.price}</p>
      <p>⭐ ${place.rating}</p>
      <p>🕒 ${place.hours}</p>

      <div class="tags">
        ${place.tags.map(t => `<span class="tag">${t}</span>`).join("")}
      </div>

      <div class="review">💬 “${place.review}”</div>

      <div class="arrows">
        <button onclick="prevPlace()">ימינה</button>
        <button onclick="nextPlace()">שמאלה</button>
      </div>

      <a href="${mapLink}" target="_blank">
        <button class="action-btn">פתח במפות</button>
      </a>

      <a href="${whatsappLink}" target="_blank">
        <button class="whatsapp-btn">שלח לחבר בוואטסאפ</button>
      </a>

      <p class="small">התמונות והמידע כרגע לגרסת בדיקה</p>
    </div>
  `;
}
</script>

</body>
</html>
