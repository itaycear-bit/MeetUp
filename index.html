<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleAir</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f2ec;
  color:#191919;
}

#app{
  max-width:430px;
  margin:auto;
  padding:22px 18px 70px;
}

.hero{
  min-height:360px;
  border-radius:0 0 38px 38px;
  background:
    radial-gradient(circle at top left,#fff 0,#f3e2d2 45%,#d9c2ad 100%);
  padding:34px 20px;
  text-align:center;
  box-shadow:0 18px 45px rgba(0,0,0,.08);
}

.logo{
  width:92px;
  height:92px;
  margin:auto;
  border-radius:30px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  box-shadow:0 18px 35px rgba(0,0,0,.12);
  animation:float 2.6s infinite;
}

@keyframes float{
  50%{transform:translateY(-10px)}
}

h1{
  font-size:52px;
  margin:18px 0 8px;
}

.subtitle{
  color:#66584d;
  font-size:17px;
  line-height:1.6;
}

.hero button{
  margin-top:22px;
}

.card{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);
  border-radius:30px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 16px 36px rgba(0,0,0,.08);
}

label{
  display:block;
  text-align:right;
  font-weight:900;
  margin-top:14px;
  margin-bottom:7px;
}

input,select{
  width:100%;
  border:0;
  background:#f1e8df;
  padding:16px;
  border-radius:18px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:20px;
  padding:16px;
  margin-top:16px;
  font-size:17px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#151515,#5b493d);
  cursor:pointer;
  box-shadow:0 12px 25px rgba(0,0,0,.16);
}

.style-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}

.style-card{
  background:#fff;
  border-radius:22px;
  padding:16px 10px;
  box-shadow:0 10px 24px rgba(0,0,0,.07);
  cursor:pointer;
  transition:.2s;
  text-align:center;
  font-weight:900;
}

.style-card:hover{
  transform:translateY(-3px);
}

.style-card .emoji{
  font-size:34px;
  display:block;
  margin-bottom:8px;
}

#result{
  display:none;
}

.outfit{
  background:#faf6f1;
  border-radius:28px;
  padding:17px;
  margin-top:16px;
  border:1px solid rgba(0,0,0,.04);
}

.outfit-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.outfit h3{
  margin:0;
  font-size:22px;
}

.big-icon{
  font-size:44px;
  background:white;
  border-radius:18px;
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.items{
  display:grid;
  gap:10px;
  margin-top:14px;
}

.item{
  background:white;
  border-radius:18px;
  padding:13px;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.tag{
  background:white;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.actions button,
.actions a{
  margin:0;
  text-decoration:none;
  text-align:center;
  border-radius:18px;
  padding:14px;
  font-weight:900;
}

.save{
  background:#8b6f5a;
}

.shop{
  background:#111;
  color:white;
}

.saved{
  display:none;
}

.empty{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="hero">
  <div class="logo">👕✨</div>
  <h1>StyleAir</h1>
  <p class="subtitle">
    תבנה לוק שמתאים לך לפי סגנון, מידה, תקציב והשראה מטיקטוק.
  </p>
  <button onclick="document.getElementById('builder').scrollIntoView({behavior:'smooth'})">
    התחל לבנות לוק
  </button>
</div>

<div id="app">

  <div class="card" id="builder">
    <h2>✨ בונה הלוקים</h2>

    <label>השראה מטיקטוק</label>
    <input id="tiktok" placeholder="הדבק קישור או תיאור של הלוק">

    <label>סגנון</label>
    <select id="style">
      <option value="Streetwear">Streetwear</option>
      <option value="Old School">Old School</option>
      <option value="Casual">Casual</option>
      <option value="Elegant">Elegant</option>
      <option value="Dark">Dark / Night</option>
    </select>

    <label>מידה</label>
    <select id="size">
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
    </select>

    <label>תקציב</label>
    <select id="budget">
      <option value="זול">זול</option>
      <option value="בינוני">בינוני</option>
      <option value="גבוה">גבוה</option>
    </select>

    <button onclick="buildLook()">בנה לי 3 לוקים</button>
  </div>

  <div class="card">
    <h2>בחר סגנון מהר</h2>
    <div class="style-grid">
      <div class="style-card" onclick="quickStyle('Streetwear')"><span class="emoji">👟</span>Street</div>
      <div class="style-card" onclick="quickStyle('Old School')"><span class="emoji">🧥</span>Old School</div>
      <div class="style-card" onclick="quickStyle('Casual')"><span class="emoji">👕</span>Casual</div>
      <div class="style-card" onclick="quickStyle('Elegant')"><span class="emoji">🕶️</span>Elegant</div>
    </div>
  </div>

  <div id="result" class="card">
    <h2>הלוקים שלך</h2>
    <div id="outfits"></div>
  </div>

  <div id="savedBox" class="card saved">
    <h2>❤️ לוקים שמורים</h2>
    <div id="savedLooks"></div>
  </div>

</div>

<script>
let saved = JSON.parse(localStorage.getItem("savedLooks")) || [];

const looks = {
  Streetwear:{
    icon:"👟",
    name:"Streetwear",
    sets:[
      ["חולצת אוברסייז", "ג׳ינס רחב", "סניקרס לבנות", "שרשרת עדינה"],
      ["הודי רחב", "דגמ״ח שחור", "נעלי ספורט גבוהות", "תיק צד"],
      ["טי־שירט גרפית", "מכנס רחב", "סניקרס צבעוניות", "כובע"]
    ]
  },
  "Old School":{
    icon:"🧥",
    name:"Old School",
    sets:[
      ["ג׳קט וינטג׳", "חולצה חלקה", "ג׳ינס ישר", "נעלי עור"],
      ["חולצת פולו", "ג׳ינס בהיר", "סניקרס רטרו", "שעון ישן"],
      ["מעיל ג׳ינס", "טי־שירט לבנה", "מכנס ישר", "נעליים קלאסיות"]
    ]
  },
  Casual:{
    icon:"👕",
    name:"Casual",
    sets:[
      ["טי־שירט איכותית", "מכנס נוח", "סניקרס נקיות", "שעון פשוט"],
      ["חולצת פשתן", "מכנס קצר נקי", "נעליים לבנות", "צמיד עדין"],
      ["סווטשירט דק", "ג׳ינס כחול", "נעלי קז׳ואל", "בושם עדין"]
    ]
  },
  Elegant:{
    icon:"🕶️",
    name:"Elegant",
    sets:[
      ["חולצה מכופתרת", "מכנס מחויט", "נעליים נקיות", "בושם טוב"],
      ["סריג דק", "מכנס שחור", "נעלי עור", "שעון מתכתי"],
      ["בלייזר קל", "טי־שירט חלקה", "מכנס אלגנט", "משקפי שמש"]
    ]
  },
  Dark:{
    icon:"🌙",
    name:"Dark Night",
    sets:[
      ["חולצה שחורה", "ג׳ינס שחור", "נעליים כהות", "אקססורי כסף"],
      ["הודי שחור", "מכנס קרגו כהה", "סניקרס שחורות", "שרשרת"],
      ["מעיל עור", "חולצה כהה", "ג׳ינס שחור", "טבעת כסף"]
    ]
  }
};

function quickStyle(style){
  document.getElementById("style").value = style;
  buildLook();
}

function buildLook(){
  const style = document.getElementById("style").value;
  const size = document.getElementById("size").value;
  const budget = document.getElementById("budget").value;
  const tiktok = document.getElementById("tiktok").value;

  const data = looks[style];

  document.getElementById("result").style.display = "block";

  document.getElementById("outfits").innerHTML =
    data.sets.map((set,index)=>`
      <div class="outfit">
        <div class="outfit-head">
          <div>
            <h3>${data.name} Fit ${index+1}</h3>
            <p>${tiktok ? "מבוסס גם על ההשראה שהכנסת 🔗" : "לוק שנבנה לפי הבחירות שלך."}</p>
          </div>
          <div class="big-icon">${data.icon}</div>
        </div>

        <div class="items">
          ${set.map(item=>`<div class="item">🛍️ ${item}</div>`).join("")}
        </div>

        <div class="tags">
          <span class="tag">מידה ${size}</span>
          <span class="tag">תקציב ${budget}</span>
          <span class="tag">${style}</span>
        </div>

        <div class="actions">
          <button class="save" onclick="saveLook('${data.name} Fit ${index+1}')">❤️ שמור</button>
          <a class="shop" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(style + ' outfit clothes ' + size)}">חפש בגדים</a>
        </div>
      </div>
    `).join("");

  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function saveLook(name){
  if(!saved.includes(name)){
    saved.push(name);
    localStorage.setItem("savedLooks", JSON.stringify(saved));
  }
  renderSaved();
}

function renderSaved(){
  const box = document.getElementById("savedBox");
  const list = document.getElementById("savedLooks");

  if(saved.length === 0){
    box.style.display = "none";
    return;
  }

  box.style.display = "block";
  list.innerHTML = saved.map(s=>`<div class="item">❤️ ${s}</div>`).join("");
}

renderSaved();
</script>

</body>
</html>
