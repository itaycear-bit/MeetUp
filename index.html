<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍒 MeetUp</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff,#ffeef3,#f2f2f2);color:#111;transition:.3s}
.dark{background:#111;color:white}
.dark .card,.dark .grid button,.dark .search{background:#1d1d1d;color:white}
.dark .card p{color:#ddd}
#app{max-width:430px;margin:auto;padding:24px 18px 60px;text-align:center}
.big-cherry{font-size:120px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.18));animation:float 2s infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.title{font-size:48px;font-weight:900;margin:0}
.subtitle{color:#666;margin:8px 0 22px}
.actions,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
button{border:0;border-radius:18px;padding:15px;font-size:16px;cursor:pointer}
.main-btn{color:white;font-weight:700}
.random{background:#111}.loc{background:#0f9d58}.favorites-btn{background:#ff4d6d}.dark-btn{background:#333}
.grid button{background:white;box-shadow:0 8px 22px rgba(0,0,0,.1)}
.search{width:100%;box-sizing:border-box;border:0;border-radius:18px;padding:16px;font-size:16px;box-shadow:0 8px 22px rgba(0,0,0,.1)}
.card{background:white;border-radius:28px;padding:22px;margin-top:24px;box-shadow:0 14px 36px rgba(0,0,0,.15);animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card h2{font-size:28px;margin:0 0 10px}.card p{color:#444}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tag{background:#eee;border-radius:999px;padding:7px 12px;font-size:13px;color:#111}
.mood-badge{display:inline-block;padding:8px 14px;border-radius:999px;color:white;font-size:13px;font-weight:800;margin-bottom:12px}
.theme-בר{background:#6d28d9}.theme-פיצה{background:#f97316}.theme-קפה{background:#92400e}.theme-אוכל{background:#dc2626}.theme-פארק{background:#16a34a}.theme-ים{background:#0284c7}
.arrows{display:flex;gap:10px;margin-top:14px}.arrows button{flex:1;background:#eee}
.action{width:100%;background:#111;color:white;margin-top:10px}
.whatsapp{width:100%;background:#25D366;color:white;margin-top:10px}
.delete{width:100%;background:#444;color:white;margin-top:10px}
.save{width:100%;margin-top:14px;background:linear-gradient(135deg,#ff4d6d,#ff758f);color:white;font-weight:800;box-shadow:0 10px 24px rgba(255,77,109,.35)}
.open{color:#0f9d58;font-weight:800}.closed{color:#e53935;font-weight:800}
#dice{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;z-index:9999;animation:spin 1s linear infinite}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);z-index:9998}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg) scale(1.2)}}
#splash{position:fixed;inset:0;background:linear-gradient(180deg,#fff,#ffeef3);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.4s}
#splash .big-cherry{font-size:150px;cursor:pointer}
.splash-title{font-size:46px;font-weight:900;margin-top:22px}
.splash-sub{color:#777;margin-top:10px}
</style>
</head>

<body>

<div id="splash">
  <div class="big-cherry" onclick="openApp()">🍒</div>
  <div class="splash-title">MeetUp</div>
  <div class="splash-sub">לחץ על הדובדבן כדי להתחיל</div>
</div>

<div id="overlay"></div>

<div id="app">
  <div class="big-cherry">🍒</div>
  <h1 class="title">MeetUp</h1>
  <p class="subtitle">תבחר מקום טוב בלי לחשוב יותר מדי</p>

  <div class="actions">
    <button class="main-btn random" onclick="randomPlace()">🎲 רנדומלי</button>
    <button class="main-btn loc" onclick="enableLocation()">📍 מיקום</button>
    <button class="main-btn favorites-btn" onclick="showFavorites()">❤️ מועדפים</button>
    <button class="main-btn dark-btn" onclick="toggleDark()">🌙 מצב לילה</button>
  </div>

  <div id="locationStatus">המיקום עדיין לא הופעל</div><br>

  <input class="search" id="searchInput" placeholder="🔎 חפש בר / פיצה / ים / קפה" oninput="searchPlaces()">

  <div class="grid">
    <button onclick="showCategory('פיצה')">🍕 פיצה</button>
    <button onclick="showCategory('קפה')">☕ קפה</button>
    <button onclick="showCategory('אוכל')">🍔 אוכל</button>
    <button onclick="showCategory('בר')">🍻 בר</button>
    <button onclick="showCategory('פארק')">🌳 פארק</button>
    <button onclick="showCategory('ים')">🌊 ים</button>
  </div>

  <div id="dice">🎲</div>
  <div id="result"></div>
</div>

<script>
function openApp(){
  const s=document.getElementById("splash");
  s.style.opacity="0";
  setTimeout(()=>s.remove(),400);
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

let currentCategory="",currentIndex=0,searchMode=false,searchResults=[];
let userLat=null,userLon=null;
let favorites=JSON.parse(localStorage.getItem("favorites"))||[];

const places={
"בר":["בר גג","פאב שכונתי","בר קוקטיילים","בר יין","בר מוזיקה","בר זול","לאונג׳","בר ספורט","בר קטן","בר חוף"].map((n,i)=>({name:n,category:"בר",price:"₪40–₪160",rating:"4."+i+"⭐",desc:"מקום טוב ליציאה, שתייה ואווירה.",tags:["בר","לילה"],open:18,close:i===4?3:2})),
"פיצה":["פיצה האט","דומינוס","פיצה בוטיק","פיצה שכונתית","פיצה לילה","פיצה איטלקית","פיצה משפחתית","פיצה טבעונית","פיצה קריספי","פיצה דייט"].map((n,i)=>({name:n,category:"פיצה",price:"₪40–₪120",rating:"4."+i+"⭐",desc:"פיצה טעימה לערב קליל.",tags:["פיצה","קליל"],open:11,close:i===4?2:23})),
"קפה":["לנדוור","ארומה","קפה שקט","קפה בוטיק","קפה קינוחים","קפה מאוחר","בית קפה קטן","קפה עם נוף","קפה עבודה","קפה שכונתי"].map((n,i)=>({name:n,category:"קפה",price:"₪20–₪90",rating:"4."+i+"⭐",desc:"מקום נעים לקפה ושיחה.",tags:["קפה","שיחה"],open:8,close:i===5?24:22})),
"אוכל":["BBB","סושי בר","שווארמה","איטלקי","אסייתי","המבורגר בוטיק","טאקו","מסעדה משפחתית","ראמן","דיינר"].map((n,i)=>({name:n,category:"אוכל",price:"₪35–₪150",rating:"4."+i+"⭐",desc:"אוכל טוב ליציאה.",tags:["אוכל","טעים"],open:12,close:i===5?1:24})),
"פארק":["פארק גדול","גן שקט","טיילת ירוקה","פינת ישיבה","פארק עם נוף","גן משפחתי","פארק ספורט","שביל הליכה","פארק לילה","גן קטן"].map((n,i)=>({name:n,category:"פארק",price:"חינם",rating:"4."+i+"⭐",desc:"מקום רגוע לשבת ולדבר.",tags:["פארק","שקט"],open:0,close:24})),
"ים":["חוף שקט","טיילת ים","חוף שקיעה","קפה ליד הים","בר חוף","חוף חברים","חוף רגוע","ספסל מול הים","חוף לילה","מרינה"].map((n,i)=>({name:n,category:"ים",price:"חינם",rating:"4."+i+"⭐",desc:"ים, אווירה ושיחה טובה.",tags:["ים","שקיעה"],open:0,close:24}))
};

function isOpen(p){
  let h=new Date().getHours();
  if(p.open===0&&p.close===24)return true;
  if(p.close===24)return h>=p.open;
  if(p.close<p.open)return h>=p.open||h<p.close;
  return h>=p.open&&h<p.close;
}

function hoursText(p){
  if(p.open===0&&p.close===24)return "פתוח 24/7";
  return `פתוח מ-${String(p.open).padStart(2,"0")}:00 עד ${String(p.close).padStart(2,"0")}:00`;
}

function moodText(c){
  if(c==="בר")return "מושלם ללילה 🌙";
  if(c==="ים")return "אווירה רגועה ושקיעה 🌊";
  if(c==="פארק")return "שקט ונעים לדבר 🌳";
  if(c==="קפה")return "טוב לשיחה רגועה ☕";
  if(c==="פיצה")return "קליל וכיף עם חברים 🍕";
  if(c==="אוכל")return "רעב? זה הכיוון 🍔";
  return "";
}

function allPlaces(){
  let a=[];
  for(let c in places){
    places[c].forEach((p,i)=>a.push({...p,category:c,index:i}));
  }
  return a;
}

function getList(){
  return searchMode?searchResults:places[currentCategory];
}

function getPlace(){
  let l=getList();
  return l&&l[currentIndex];
}

function renderPlace(){
  let p=getPlace();

  if(!p){
    document.getElementById("result").innerHTML=`<div class="card"><h2>בחר קטגוריה 🍒</h2></div>`;
    return;
  }

  let category=p.category||currentCategory;
  let open=isOpen(p)?`<span class="open">🟢 פתוח עכשיו</span>`:`<span class="closed">🔴 סגור עכשיו</span>`;
  let map=userLat?`https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${userLat},${userLon},15z`:`https://www.google.com/maps/search/${encodeURIComponent(p.name)}`;
  let wa="https://wa.me/?text="+encodeURIComponent("בוא ניפגש פה 🍒\n"+p.name+"\n"+p.desc+"\n"+map);

  document.getElementById("result").innerHTML=`
  <div class="card">
    <div class="mood-badge theme-${category}">${moodText(category)}</div>
    <h2>🍒 ${p.name}</h2>
    <p>${p.desc}</p>
    <p>💰 ${p.price}</p>
    <p>⭐ ${p.rating}</p>
    <p>🕒 ${hoursText(p)}</p>
    <p>${open}</p>

    <div class="tags">
      ${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}
    </div>

    <button class="save" onclick="saveFavorite()">❤️ שמור מקום</button>

    <div class="arrows">
      <button onclick="prevPlace()">➡️ הקודם</button>
      <button onclick="nextPlace()">⬅️ הבא</button>
    </div>

    <button class="action" onclick="window.open('${map}')">📍 פתח במפות</button>
    <button class="whatsapp" onclick="window.open('${wa}')">📲 שלח בוואטסאפ</button>
  </div>`;
}

function showCategory(c){
  searchMode=false;
  currentCategory=c;
  currentIndex=0;
  renderPlace();
}

function nextPlace(){
  let l=getList();
  if(!l||!l.length)return;
  currentIndex=(currentIndex+1)%l.length;
  renderPlace();
}

function prevPlace(){
  let l=getList();
  if(!l||!l.length)return;
  currentIndex--;
  if(currentIndex<0)currentIndex=l.length-1;
  renderPlace();
}

function searchPlaces(){
  let q=document.getElementById("searchInput").value.trim().toLowerCase();

  if(!q){
    searchMode=false;
    document.getElementById("result").innerHTML="";
    return;
  }

  searchResults=allPlaces().filter(p=>
    (p.category+" "+p.name+" "+p.desc+" "+p.tags.join(" "))
    .toLowerCase()
    .includes(q)
  );

  if(!searchResults.length){
    document.getElementById("result").innerHTML=`<div class="card"><h2>לא מצאתי כלום 😅</h2></div>`;
    return;
  }

  searchMode=true;
  currentIndex=0;
  renderPlace();
}

function randomPlace(){
  let d=document.getElementById("dice");
  let o=document.getElementById("overlay");

  o.style.display="block";
  d.style.display="block";

  setTimeout(()=>{
    o.style.display="none";
    d.style.display="none";

    let cats=Object.keys(places);
    currentCategory=cats[Math.floor(Math.random()*cats.length)];
    currentIndex=Math.floor(Math.random()*places[currentCategory].length);
    searchMode=false;
    renderPlace();
  },1500);
}

function enableLocation(){
  let s=document.getElementById("locationStatus");

  if(!navigator.geolocation){
    s.innerText="❌ אין תמיכה במיקום";
    return;
  }

  s.innerText="📍 מבקש מיקום...";

  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLat=pos.coords.latitude;
      userLon=pos.coords.longitude;
      s.innerText="✅ המיקום הופעל";
    },
    err=>{
      s.innerText="❌ צריך HTTPS או אישור מיקום";
    }
  );
}

function saveFavorite(){
  let p=getPlace();
  if(!p)return;

  if(favorites.find(f=>f.name===p.name)){
    alert("כבר שמור ❤️");
    return;
  }

  favorites.push(p);
  localStorage.setItem("favorites",JSON.stringify(favorites));
  alert("נשמר ❤️");
}

function showFavorites(){
  if(!favorites.length){
    document.getElementById("result").innerHTML=`<div class="card"><h2>אין מועדפים עדיין ❤️</h2></div>`;
    return;
  }

  document.getElementById("result").innerHTML=favorites.map((p,i)=>{
    let map=userLat?`https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${userLat},${userLon},15z`:`https://www.google.com/maps/search/${encodeURIComponent(p.name)}`;
    let wa="https://wa.me/?text="+encodeURIComponent("בוא ניפגש פה 🍒\n"+p.name+"\n"+p.desc+"\n"+map);

    return `
    <div class="card">
      <h2>❤️ ${p.name}</h2>
      <p>${p.desc}</p>
      <p>⭐ ${p.rating}</p>
      <p>💰 ${p.price}</p>
      <button class="action" onclick="window.open('${map}')">📍 פתח במפות</button>
      <button class="whatsapp" onclick="window.open('${wa}')">📲 שלח בוואטסאפ</button>
      <button class="delete" onclick="removeFavorite(${i})">🗑️ מחק</button>
    </div>`;
  }).join("");
}

function removeFavorite(i){
  favorites.splice(i,1);
  localStorage.setItem("favorites",JSON.stringify(favorites));
  showFavorites();
}
</script>

</body>
</html>
