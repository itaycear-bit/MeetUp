<div id="splash">
  <div class="splash-logo">🍒</div>
  <div class="splash-title">MeetUp</div>
  <div class="splash-sub">לחץ על הדובדבן כדי להתחיל</div>
</div>

<style>
#splash{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#111,#1b1b1b);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:20000;
  transition:.4s;
}

.splash-logo{
  font-size:120px;
  cursor:pointer;
  animation:float 2s ease-in-out infinite;
}

.splash-title{
  color:white;
  font-size:42px;
  font-weight:900;
  margin-top:10px;
}

.splash-sub{
  color:#aaa;
  margin-top:10px;
  font-size:15px;
}

@keyframes float{
  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-12px);
  }

  100%{
    transform:translateY(0);
  }
}
</style>

<script>
window.onload = () => {

  const cherry =
  document.querySelector(".splash-logo");

  cherry.onclick = () => {

    const splash =
    document.getElementById("splash");

    splash.style.opacity = "0";

    setTimeout(() => {

      splash.style.display = "none";

    },400);
  };
};
</script>
