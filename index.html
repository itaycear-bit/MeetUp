<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>

body{
  margin:0;
  font-family:-apple-system,Arial,sans-serif;
  background:linear-gradient(180deg,#fff,#eee);
  color:#111;
}

#app{
  max-width:430px;
  margin:auto;
  padding:24px 18px 60px;
  text-align:center;
}

.logo{
  font-size:58px;
}

.title{
  font-size:48px;
  font-weight:900;
  margin:0;
}

.subtitle{
  color:#666;
  margin:10px 0 25px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.main-btn{
  border:0;
  border-radius:18px;
  padding:16px;
  font-size:15px;
  color:white;
  cursor:pointer;
}

.random-btn{background:#111;}
.smart-btn{background:#7c3aed;}
.location-btn{background:#0f9d58;}
.favorites-btn{background:#ff4d6d;}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px;
}

.grid button{
  border:0;
  border-radius:22px;
  background:white;
  padding:18px;
  font-size:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.1);
  cursor:pointer;
}

.section{
  background:white;
  border-radius:26px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.section-title{
  font-weight:800;
  margin-bottom:14px;
  text-align:right;
}

.trending-row{
  display:flex;
  overflow:auto;
  gap:10px;
}

.trend-card{
  min-width:145px;
  border:0;
  border-radius:22px;
  background:#111;
  color:white;
  padding:16px;
  text-align:right;
  cursor:pointer;
}

.trend-card span{
  display:block;
  font-size:12px;
  opacity:.75;
  margin-top:6px;
}

.card{
  margin-top:28px;
  background:white;
  border-radius:30px;
  padding:22px;
  box-shadow:0 14px 36px rgba(0,0,0,.14);
  animation:cardPop .35s ease;
}

@keyframes cardPop{

  from{
    opacity:0;
    transform:translateY(20px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card h2{
  font-size:28px;
  margin:0 0 10px;
}

.card p{
  color:#444;
  font-size:16px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:15px 0;
}

.tag{
  background:#efefef;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
}

.review{
  background:#f5f5f5;
  border-radius:18px;
  padding:14px;
  margin-top:12px;
}

.arrows{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.arrows button{
  flex:1;
  border:0;
  border-radius:16px;
  padding:14px;
  background:#efefef;
  cursor:pointer;
}

.action-btn,
.whatsapp-btn,
.fav-btn,
.delete-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  margin-top:12px;
  cursor:pointer;
}

.action-btn{
  background:#111;
  color:white;
}

.whatsapp-btn{
  background:#25D366;
  color:white;
}

.fav-btn{
  background:#ff4d6d;
  color:white;
}

.delete-btn{
  background:#444;
  color:white;
}

.location-status{
  font-size:13px;
  color:#888;
  margin-top:12px;
}

.open{
  color:#0f9d58;
  font-weight:800;
}

.closed{
  color:#e53935;
  font-weight:800;
}

#splash{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#111,#1b1b1b);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:99999;
  transition:.4s;
}

.splash-logo{
  font-size:120px;
  cursor:pointer;
  animation:float 2s ease-in-out infinite;
}

.splash-title{
  color:white;
  font-size:42px;
  font-weight:900;
}

.splash-sub{
  color:#aaa;
  margin-top:10px;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
  100%{transform:translateY(0);}
}

#dice{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:120px;
  z-index:9999;
  animation:spin 1s linear infinite;
  filter:drop-shadow(0 0 20px rgba(255,255,255,.5));
}

@keyframes spin{

  0%{
    transform:translate(-50%,-50%) rotate(0deg) scale(1);
  }

  50%{
    transform:translate(-50%,-50%) rotate(180deg) scale(1.25);
  }

  100%{
    transform:translate(-50%,-50%) rotate(360deg) scale(1);
  }
}

#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  z-index:9998;
}

</style>
</head>

<body>

<div id="splash">
  <div class="splash-logo">🍒</div>
  <div class="splash-title">MeetUp</div>
  <div class="splash-sub">לחץ על הדובדבן כדי להתחיל</div>
</div>

<div id="overlay"></div>

<div id="app">

<div class="logo">🍒</div>

<h1 class="title">MeetUp</h1>

<p class="subtitle">
תבחר מקום טוב בלי לחשוב יותר מדי 🍒
</p>

<div class="actions">

<button class="main-btn random-btn"
onclick="randomPlace()">
🎲 רנדומלי
</button>

<button class="main-btn smart-btn"
onclick="smartPick()">
🧠 חכם
</button>

<button class="main-btn location-btn"
onclick="enableLocation()">
📍 מיקום
</button>

<button class="main-btn favorites-btn"
onclick="showFavorites()">
❤️ מועדפים
</button>

</div>

<div id="locationStatus"
class="location-status">
המיקום עדיין לא הופעל
</div>

<div class="grid">

<button onclick="showCategory('פיצה')">
🍕 פיצה
</button>

<button onclick="showCategory('קפה')">
☕ קפה
</button>

<button onclick="showCategory('אוכל')">
🍔 אוכל
</button>

<button onclick="showCategory('בר')">
🍻 בר
</button>

<button onclick="showCategory('פארק')">
🌳 פארק
</button>

<button onclick="showCategory('ים')">
🌊 ים
</button>

</div>

<div id="dice">🎲</div>

<div id="result"></div>

</div>

<script>

document.querySelector(".splash-logo").onclick = () => {

  const splash =
  document.getElementById("splash");

  splash.style.opacity = "0";

  setTimeout(() => {

    splash.remove();

  },400);
};

let currentCategory = "";
let currentIndex = 0;
let userLat = null;
let userLon = null;

const places = {

"פיצה":[
{
name:"פיצה האט",
price:"₪50–₪100",
rating:"4.2⭐",
hours:"פתוח עד 23:00",
close:23,
desc:"פיצה טובה לקבוצה ולערב קליל.",
tags:["פיצה","חברים","לילה"]
},
{
name:"דומינוס",
price:"₪45–₪90",
rating:"4.4⭐",
hours:"פתוח עד 00:00",
close:24,
desc:"פיצה מהירה שמתאימה לערב קליל.",
tags:["מהיר","פיצה"]
}
],

"קפה":[
{
name:"לנדוור",
price:"₪35–₪70",
rating:"4.5⭐",
hours:"פתוח עד 23:00",
close:23,
desc:"קפה, בראנץ׳ וישיבה ארוכה.",
tags:["קפה","שיחה"]
},
{
name:"ארומה",
price:"₪20–₪45",
rating:"4.2⭐",
hours:"פתוח עד 22:00",
close:22,
desc:"קפה קליל ומהיר.",
tags:["זול","מהיר"]
}
],

"אוכל":[
{
name:"BBB",
price:"₪60–₪110",
rating:"4.6⭐",
hours:"פתוח עד 00:00",
close:24,
desc:"המבורגרים ואווירה טובה.",
tags:["המבורגר","חברים"]
}
],

"בר":[
{
name:"בר גג",
price:"₪70–₪150",
rating:"4.7⭐",
hours:"פתוח עד 02:00",
close:2,
desc:"נוף יפה וקוקטיילים.",
tags:["נוף","לילה"]
}
],

"פארק":[
{
name:"פארק גדול",
price:"חינם",
rating:"4.8⭐",
hours:"פתוח 24/7",
close:24,
desc:"טבע, אוויר פתוח ושקט.",
tags:["טבע","שקט"]
}
],

"ים":[
{
name:"חוף שקט",
price:"חינם",
rating:"4.9⭐",
hours:"פתוח 24/7",
close:24,
desc:"ים, שקיעה ושיחה טובה.",
tags:["ים","שקיעה"]
}
]

};

function isOpen(place){

  const hour =
  new Date().getHours();

  if(place.close === 24)
  return true;

  if(place.close <= 6){

    return hour >= 18 ||
    hour < place.close;
  }

  return hour < place.close;
}

function showCategory(category){

  currentCategory = category;

  currentIndex = 0;

  renderPlace();
}

function renderPlace(){

  const place =
  places[currentCategory][currentIndex];

  const openText =
  isOpen(place)

  ? `<span class="open">
  🟢 פתוח עכשיו
  </span>`

  : `<span class="closed">
  🔴 סגור עכשיו
  </span>`;

  const mapLink =
  userLat && userLon

  ? `https://www.google.com/maps/search/${encodeURIComponent(place.name)}/@${userLat},${userLon},15z`

  : `https://www.google.com/maps/search/${encodeURIComponent(place.name)}`;

  const whatsappLink =
  "https://wa.me/?text=" +
  encodeURIComponent(
  "בוא ניפגש פה 🍒\n" +
  place.name + "\n" +
  place.desc + "\n" +
  mapLink
  );

  document.getElementById("result")
  .innerHTML = `

  <div class="card">

    <h2>
      🍒 ${place.name}
    </h2>

    <p>${place.desc}</p>

    <p>💰 ${place.price}</p>

    <p>⭐ ${place.rating}</p>

    <p>🕒 ${place.hours}</p>

    <p>${openText}</p>

    <div class="tags">

      ${place.tags.map(tag =>
      `<span class="tag">
      ${tag}
      </span>`
      ).join("")}

    </div>

    <div class="review">
    💬 מקום מומלץ ליציאה קלילה
    </div>

    <div class="arrows">

      <button onclick="prevPlace()">
      ➡️ הקודם
      </button>

      <button onclick="nextPlace()">
      ⬅️ הבא
      </button>

    </div>

    <button class="action-btn"
    onclick="window.open('${mapLink}')">
    📍 פתח במפות
    </button>

    <button class="whatsapp-btn"
    onclick="window.open('${whatsappLink}')">
    📲 שלח בוואטסאפ
    </button>

  </div>
  `;
}

function nextPlace(){

  currentIndex++;

  if(
    currentIndex >=
    places[currentCategory].length
  ){

    currentIndex = 0;
  }

  renderPlace();
}

function prevPlace(){

  currentIndex--;

  if(currentIndex < 0){

    currentIndex =
    places[currentCategory].length - 1;
  }

  renderPlace();
}

function randomPlace(){

  const dice =
  document.getElementById("dice");

  const overlay =
  document.getElementById("overlay");

  document.getElementById("result")
  .innerHTML = "";

  overlay.style.display = "block";

  dice.style.display = "block";

  navigator.vibrate?.(200);

  setTimeout(() => {

    overlay.style.display = "none";

    dice.style.display = "none";

    const categories =
    Object.keys(places);

    currentCategory =
    categories[
      Math.floor(
      Math.random() *
      categories.length
      )
    ];

    currentIndex =
    Math.floor(
    Math.random() *
    places[currentCategory].length
    );

    renderPlace();

  },1800);
}

function smartPick(){

  const hour =
  new Date().getHours();

  if(hour >= 20){

    currentCategory = "בר";
  }

  else if(hour >= 16){

    currentCategory = "אוכל";
  }

  else{

    currentCategory = "קפה";
  }

  currentIndex = 0;

  renderPlace();
}

function enableLocation(){

  if(!navigator.geolocation){

    document.getElementById(
    "locationStatus"
    ).innerText =
    "אין תמיכה במיקום";

    return;
  }

  document.getElementById(
  "locationStatus"
  ).innerText =
  "מבקש מיקום...";

  navigator.geolocation
  .getCurrentPosition(

  pos => {

    userLat =
    pos.coords.latitude;

    userLon =
    pos.coords.longitude;

    document.getElementById(
    "locationStatus"
    ).innerText =
    "✅ המיקום הופעל";
  },

  () => {

    document.getElementById(
    "locationStatus"
    ).innerText =
    "לא אישרת מיקום";
  }

  );
}

</script>

</body>
</html>
