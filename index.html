<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #fafafa, #e9e9e9);
  color: #111;
}

#app {
  max-width: 430px;
  margin: auto;
  padding: 35px 22px;
  text-align: center;
}

.logo {
  font-size: 55px;
}

.title {
  font-size: 50px;
  font-weight: 900;
  margin: 5px 0;
}

.subtitle {
  color: #555;
  font-size: 17px;
  margin-bottom: 28px;
}

.main-btn {
  width: 100%;
  padding: 18px;
  background: #111;
  color: white;
  border: none;
  border-radius: 22px;
  font-size: 18px;
}

.options {
  display: none;
  margin-top: 28px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.grid button, .place-btn {
  background: white;
  border: none;
  border-radius: 20px;
  padding: 18px;
  font-size: 16px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.10);
}

#placesList {
  margin-top: 25px;
  display: grid;
  gap: 12px;
}

.place-btn {
  text-align: right;
}

.card {
  margin-top: 28px;
  background: white;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  animation: pop 0.25s ease;
}

@keyframes pop {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.place-img {
  width: 100%;
  height: 170px;
  border-radius: 22px;
  object-fit: cover;
  margin-bottom: 16px;
}

.card h2 {
  margin: 5px 0 12px;
  font-size: 26px;
}

.card p {
  font-size: 16px;
  margin: 9px 0;
  color: #333;
}

.action-btn, .whatsapp-btn {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 15px;
  font-size: 16px;
  margin-top: 10px;
}

.action-btn {
  background: #111;
  color: white;
}

.whatsapp-btn {
  background: #25D366;
  color: white;
}

button {
  cursor: pointer;
}

.small {
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="app">
  <div class="logo">📍</div>
  <h1 class="title">MeetUp</h1>
  <p class="subtitle">בחרו וייב, קבלו 6 מקומות, ואז תפתחו במפות</p>

  <button class="main-btn" onclick="start()">מצא לי מקום</button>

  <div id="options" class="options">
    <p><b>בחרו וייב</b></p>

    <div class="grid">
      <button onclick="showPlaces('קפה')">☕ קפה</button>
      <button onclick="showPlaces('אוכל')">🍔 אוכל</button>
      <button onclick="showPlaces('פארק')">🌳 פארק</button>
      <button onclick="showPlaces('בר')">🍻 בר</button>
      <button onclick="showPlaces('קינוח')">🍰 קינוח</button>
      <button onclick="showPlaces('שקט')">🤫 שקט</button>
    </div>
  </div>

  <div id="placesList"></div>
  <div id="result"></div>
</div>

function showPlaces(type) {
  document.getElementById("result").innerHTML = "";
  let list = places[type];

  document.getElementById("placesList").innerHTML =
    "<h3>בחרו מקום</h3>" +
    list.map((place, index) => `
      <button class="place-btn" onclick="showDetails('${type}', ${index})">
        <b>${place.name}</b><br>
        ${place.taste} · ${place.price} · ${place.rating}
      </button>
    `).join("");
}

function showDetails(type, index) {
  let place = places[type][index];
  let mapLink = "https://www.google.com/maps/search/" + encodeURIComponent(place.name);

  let whatsappText =
    "בוא ניפגש פה 👇🔥\n" +
    place.name + "\n" +
    place.desc + "\n" +
    place.price + " | " + place.rating + "\n" +
    place.hours + "\n" +
    mapLink;

  let whatsappLink = "https://wa.me/?text=" + encodeURIComponent(whatsappText);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <img class="place-img" src="${place.img}">
      <h2>📍 ${place.name}</h2>
      <p>✨ ${place.desc}</p>
      <p>🍽️ ${place.taste}</p>
      <p>💰 ${place.price}</p>
      <p>⭐ ${place.rating}</p>
      <p>🕒 ${place.hours}</p>

      <a href="${mapLink}" target="_blank">
        <button class="action-btn">פתח במפות</button>
      </a>

      <a href="${whatsappLink}" target="_blank">
        <button class="whatsapp-btn">שלח לחבר בוואטסאפ</button>
      </a>

      <p class="small">המחירים, השעות והדירוגים כרגע לדוגמה</p>
    </div>
  `;
}
</script>

</html>
