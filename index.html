<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetUp</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, Arial, sans-serif;
  background: #f5f5f7;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #111;
}

#app {
  text-align: center;
  max-width: 380px;
  width: 100%;
  padding: 24px;
}

.title {
  font-size: 46px;
  font-weight: 900;
  margin-bottom: 10px;
}

.subtitle {
  color: #444;
  margin-bottom: 25px;
}

.main-btn {
  width: 100%;
  padding: 16px;
  background: #111;
  color: white;
  border: none;
  border-radius: 18px;
  font-size: 17px;
}

.options {
  display: none;
  margin-top: 25px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.grid button {
  background: white;
  border: none;
  border-radius: 16px;
  padding: 18px;
  font-size: 16px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.10);
}

.card {
  margin-top: 28px;
  background: white;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.card p {
  font-size: 17px;
}

button {
  cursor: pointer;
}

.action-btn {
  background: #111;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 13px 18px;
}

.whatsapp-btn {
  background: #25D366;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 13px 18px;
}
</style>
</head>

<body>

<div id="app">
  <h1 class="title">MeetUp</h1>
  <p class="subtitle">לא יודעים איפה להיפגש? נמצא לכם מקום</p>

  <button class="main-btn" onclick="start()">מצא לי מקום</button>

  <div id="options" class="options">
    <p>בחרו וייב</p>

    <div class="grid">
      <button onclick="find('קפה')">☕ קפה</button>
      <button onclick="find('אוכל')">🍔 אוכל</button>
      <button onclick="find('פארק')">🌳 פארק</button>
      <button onclick="find('בר')">🍻 בר</button>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
function start() {
  document.getElementById("options").style.display = "block";
}

function find(type) {
  const places = {
    "קפה": [
      {name: "ארומה", price: "₪20–₪40", rating: "4.2⭐", taste: "קפה ומאפים"},
      {name: "לנדוור", price: "₪30–₪60", rating: "4.5⭐", taste: "בראנץ וקפה"},
      {name: "קפה גרג", price: "₪25–₪50", rating: "4.1⭐", taste: "קפה וקינוחים"}
    ],
    "אוכל": [
      {name: "BBB", price: "₪60–₪100", rating: "4.6⭐", taste: "המבורגרים"},
      {name: "סושי בר", price: "₪80–₪150", rating: "4.7⭐", taste: "סושי"},
      {name: "פיצה", price: "₪50–₪90", rating: "4.3⭐", taste: "פיצה"}
    ],
    "פארק": [
      {name: "פארק קרוב", price: "חינם", rating: "4.8⭐", taste: "טבע ואוויר פתוח"},
      {name: "גן ציבורי", price: "חינם", rating: "4.3⭐", taste: "שקט ונעים"}
    ],
    "בר": [
      {name: "פאב שכונתי", price: "₪40–₪80", rating: "4.4⭐", taste: "בירה ואווירה"},
      {name: "בר קוקטיילים", price: "₪60–₪120", rating: "4.6⭐", taste: "קוקטיילים ומוזיקה"}
    ]
  };

  let list = places[type];
  let random = list[Math.floor(Math.random() * list.length)];

  let mapLink = "https://www.google.com/maps/search/" + encodeURIComponent(random.name);

  let whatsappText =
    "בוא ניפגש פה 👇🔥\n" +
    random.name + "\n" +
    random.taste + "\n" +
    random.price + " | " + random.rating + "\n" +
    mapLink;

  let whatsappLink = "https://wa.me/?text=" + encodeURIComponent(whatsappText);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>📍 ${random.name}</h2>
      <p>🍽️ ${random.taste}</p>
      <p>💰 ${random.price}</p>
      <p>⭐ ${random.rating}</p>

      <a href="${mapLink}" target="_blank">
        <button class="action-btn">פתח במפות</button>
      </a>

      <br><br>

      <a href="${whatsappLink}" target="_blank">
        <button class="whatsapp-btn">שלח לחבר בוואטסאפ</button>
      </a>
    </div>
  `;
}
</script>

</body>
</html>
